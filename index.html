<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動細流與場佈倒數系統</title>

  <!-- PWA 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="活動指揮中樞">
  <link rel="apple-touch-icon" href="icon-512.png">

  <!-- 引入 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    body { background-color: #0d0e12; color: #f1f5f9; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; transition: padding 0.3s; }
    
    .container { width: 100%; max-width: 1320px; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1px solid #1f2430; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .title-area h1 { font-size: 19px; color: #f472b6; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sync-status { font-size: 11px; background: rgba(34, 197, 94, 0.12); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.25); padding: 2px 8px; border-radius: 999px; font-weight: 500; }
    .clock-display { font-size: 13px; color: #94a3b8; margin-top: 3px; font-family: monospace; }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    button { cursor: pointer; border: none; padding: 6px 12px; border-radius: 7px; font-weight: 600; font-size: 12px; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
    button:active { transform: scale(0.97); }
    .btn-pink { background: #db2777; color: white; }
    .btn-pink:hover { background: #be185d; }
    .btn-slate { background: #27272a; color: #f1f5f9; border: 1px solid #3f3f46; }
    .btn-slate:hover { background: #3f3f46; }
    .btn-subtle { background: rgba(244, 114, 182, 0.12); color: #f472b6; border: 1px solid rgba(244, 114, 182, 0.25); }
    .btn-subtle:hover { background: rgba(244, 114, 182, 0.2); }
    .btn-warning { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .btn-warning:hover { background: rgba(245, 158, 11, 0.25); }
    .btn-success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .btn-success:hover { background: rgba(34, 197, 94, 0.25); }
    .btn-sheet { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .btn-sheet:hover { background: rgba(16, 185, 129, 0.25); }
    .btn-projector { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: white; box-shadow: 0 0 10px rgba(99, 102, 241, 0.3); }
    .btn-projector:hover { opacity: 0.9; }
    .btn-mode-toggle { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .btn-mode-toggle:hover { background: rgba(56, 189, 248, 0.25); }
    .btn-ghost-danger { background: transparent; color: #64748b; border: 1px solid transparent; padding: 3px 6px; font-size: 12px; border-radius: 4px; }
    .btn-ghost-danger:hover { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }

    /* 身分篩選專區 */
    .filter-bar { background: #16161e; border: 1px solid #282538; border-radius: 10px; padding: 8px 14px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .filter-title { font-size: 13px; font-weight: 600; color: #f472b6; display: flex; align-items: center; gap: 6px; }
    .filter-select { background: #0d0e12; border: 1px solid #4f46e5; color: #f1f5f9; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; outline: none; cursor: pointer; }

    /* 主倒數計時看板 */
    .hero-banner { 
      background: linear-gradient(135deg, #181528 0%, #111c38 100%); 
      border: 1px solid #2d1f47; 
      border-radius: 14px; 
      padding: 16px 20px; 
      margin-bottom: 20px; 
      box-shadow: 0 8px 20px -6px rgba(0,0,0,0.5); 
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .hero-left { display: flex; flex-direction: column; gap: 4px; }
    .stage-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(244, 114, 182, 0.15); color: #f472b6; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; width: fit-content; border: 1px solid rgba(244, 114, 182, 0.25); }
    .hero-stage-name { font-size: 26px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; }
    .hero-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
    .big-timer { font-size: clamp(38px, 6vw, 54px); font-weight: 800; font-family: monospace; color: #fb7185; line-height: 1; text-shadow: 0 0 15px rgba(251, 113, 133, 0.25); }
    .next-stage-hint { color: #94a3b8; font-size: 12px; margin-top: 4px; }

    /* 三欄排版架構 */
    .main-grid { display: grid; grid-template-columns: 1fr 1.25fr 1.05fr; gap: 16px; margin-bottom: 20px; }
    @media (max-width: 1100px) { .main-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

    .panel { background: #13141a; border: 1px solid #20222c; border-radius: 12px; padding: 14px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #20222c; padding-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    .panel-title { font-size: 14px; font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 6px; }

    /* Schedule Section */
    .schedule-list { display: flex; flex-direction: column; gap: 8px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
    .schedule-item { display: flex; align-items: center; justify-content: space-between; background: #1a1b24; padding: 8px 10px; border-radius: 8px; border-left: 3px solid #475569; }
    .schedule-item.active { border-left-color: #f472b6; background: #261928; }
    .schedule-info { display: flex; align-items: center; gap: 8px; flex-grow: 1; flex-wrap: wrap; }
    .schedule-name { font-weight: 600; font-size: 13px; }
    input[type="time"] { background: #0d0e12; color: #f8fafc; border: 1px solid #333846; border-radius: 5px; padding: 2px 5px; font-size: 12px; }

    .mute-toggle-btn { background: transparent; border: 1px solid #333846; border-radius: 5px; padding: 2px 5px; font-size: 11px; color: #94a3b8; cursor: pointer; }
    .mute-toggle-btn.muted { color: #f87171; border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.08); }

    /* Groups Section */
    .groups-container { display: flex; flex-direction: column; gap: 12px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
    .group-card { background: #1a1b24; border-radius: 9px; padding: 10px 12px; border: 1px solid #282a36; transition: all 0.2s ease; }
    
    .group-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .group-title-left { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #38bdf8; }
    .collapse-icon { font-size: 11px; transition: transform 0.2s ease; color: #64748b; }
    .group-card.collapsed .collapse-icon { transform: rotate(-90deg); }
    .group-card.collapsed .group-body { display: none; }

    /* 進度條 */
    .progress-wrap { margin-top: 6px; margin-bottom: 8px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8; margin-bottom: 3px; }
    .progress-bar-bg { width: 100%; height: 4px; background: #0d0e12; border-radius: 999px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #4ade80); width: 0%; transition: width 0.3s ease; }

    .task-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #e2e8f0; background: #13141a; padding: 6px 9px; border-radius: 6px; gap: 6px; border: 1px solid transparent; transition: all 0.3s ease; }
    .task-item:hover { border-color: #272a38; }
    .task-item.done span.task-text { text-decoration: line-through; color: #475569; }
    .task-left { display: flex; align-items: center; gap: 7px; cursor: pointer; flex-grow: 1; flex-wrap: wrap; }
    
    /* 標籤 */
    .owner-tag { font-size: 11px; background: rgba(167, 139, 250, 0.12); color: #c4b5fd; padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(167, 139, 250, 0.25); white-space: nowrap; cursor: pointer; }
    .owner-tag:hover { background: rgba(167, 139, 250, 0.25); }

    .time-tag { font-size: 11px; background: rgba(56, 189, 248, 0.08); color: #7dd3fc; padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.2); white-space: nowrap; cursor: pointer; font-family: monospace; }
    .time-tag:hover { background: rgba(56, 189, 248, 0.18); }
    .time-tag.overdue { background: rgba(239, 68, 68, 0.1); color: #f87171; border-color: rgba(239, 68, 68, 0.35); font-weight: 600; }

    /* ⚡ 當前執勤高亮 */
    .task-item.current-duty {
      background: rgba(14, 165, 233, 0.12) !important;
      border: 1px solid #38bdf8 !important;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
      animation: dutyPulse 2s infinite ease-in-out;
    }

    @keyframes dutyPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(56, 189, 248, 0.25); }
      50% { box-shadow: 0 0 18px rgba(56, 189, 248, 0.55); border-color: #7dd3fc; }
    }

    .add-box { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
    .add-box input[type="text"], .add-box input[type="time"] { background: #0d0e12; border: 1px solid #2c303f; color: white; border-radius: 5px; padding: 4px 7px; font-size: 12px; }
    .input-task-text { flex-grow: 1; min-width: 120px; }
    .input-task-owner { width: 85px; }
    .time-range-group { display: flex; align-items: center; gap: 2px; font-size: 11px; color: #64748b; }

    /* 負責人彙整卡片 */
    .owner-container { display: flex; flex-direction: column; gap: 10px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
    .owner-card { background: #1a1b24; border-radius: 9px; padding: 10px 12px; border: 1px solid #282a36; }
    .owner-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .owner-card-title { font-size: 13px; font-weight: 700; color: #c084fc; display: flex; align-items: center; gap: 5px; }
    .owner-task-badge { font-size: 10px; background: rgba(56, 189, 248, 0.12); color: #38bdf8; padding: 1px 4px; border-radius: 3px; }

    .idle-alert-box { background: rgba(245, 158, 11, 0.08); border: 1px dashed rgba(245, 158, 11, 0.3); border-radius: 5px; padding: 5px 8px; font-size: 11px; color: #fcd34d; margin-top: 6px; }

    /* ⏱️ 全局時段一覽表 / 甘特圖矩陣 (Timeline View) */
    .timeline-view-panel {
      background: #13141a;
      border: 1px solid #20222c;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      overflow-x: auto;
      display: none; /* 預設隱藏，切換按鈕觸發 */
    }
    .timeline-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 780px;
      font-size: 12px;
    }
    .timeline-table th, .timeline-table td {
      border: 1px solid #222634;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    .timeline-table th {
      background: #181a24;
      color: #94a3b8;
      font-weight: 700;
      white-space: nowrap;
    }
    .timeline-table th.current-col {
      background: rgba(244, 114, 182, 0.15);
      color: #f472b6;
      border-color: #ec4899;
    }
    .timeline-person-name {
      font-weight: 700;
      color: #c084fc;
      white-space: nowrap;
      min-width: 90px;
    }
    .timeline-task-pill {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #bae6fd;
      border-radius: 6px;
      padding: 4px 7px;
      margin-bottom: 4px;
      font-size: 11px;
      line-height: 1.3;
    }
    .timeline-task-pill.is-done {
      text-decoration: line-through;
      opacity: 0.45;
    }
    .timeline-idle-cell {
      color: #475569;
      font-size: 11px;
      font-style: italic;
      padding: 4px 0;
    }

    /* 歷史專區摺疊面板 */
    .history-panel { background: #13141a; border: 1px solid #282138; border-radius: 12px; padding: 14px; margin-bottom: 20px; transition: all 0.2s ease; }
    .history-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .history-header-title { font-size: 14px; font-weight: 700; color: #c084fc; display: flex; align-items: center; gap: 6px; }
    .history-panel.collapsed .history-body { display: none; }
    .history-panel.collapsed .history-collapse-icon { transform: rotate(-90deg); }
    .history-collapse-icon { font-size: 11px; transition: transform 0.2s ease; color: #64748b; }
    
    .history-body { margin-top: 12px; border-top: 1px solid #20222c; padding-top: 10px; }
    .history-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 8px; }
    .history-card { background: #1a1b24; border: 1px solid #2c303f; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
    .history-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .history-card-name { font-weight: 700; font-size: 13px; color: #f1f5f9; }
    .history-card-date { font-size: 10px; color: #64748b; margin-top: 2px; }
    .history-card-actions { display: flex; gap: 5px; justify-content: flex-end; margin-top: 4px; }

    /* 🖥️ 投影模式 */
    body.projector-mode { padding: 20px 28px; background: #090a0f; }
    body.projector-mode .container { max-width: 100%; }
    body.projector-mode .add-box,
    body.projector-mode .btn-ghost-danger,
    body.projector-mode .filter-bar,
    body.projector-mode .history-panel,
    body.projector-mode .header-actions button:not(#projectorToggleBtn):not(#viewModeToggleBtn),
    body.projector-mode .panel-header button {
      display: none !important;
    }
    body.projector-mode .hero-stage-name { font-size: 32px; }
    body.projector-mode .big-timer { font-size: 60px; }

    footer { margin-top: 8px; font-size: 11px; text-align: center; color: #475569; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-area">
        <h1>🌸 活動細流與場佈指揮中樞 <span class="sync-status" id="syncStatus">🟢 雲端同步中</span></h1>
        <div class="clock-display" id="realtimeClock">現在時間：--:--:--</div>
      </div>
      <div class="header-actions">
        <button class="btn-mode-toggle" id="viewModeToggleBtn" onclick="toggleMainViewMode()">⏱️ 切換時段矩陣總覽</button>
        <button class="btn-projector" id="projectorToggleBtn" onclick="toggleProjectorMode()">🖥️ 投影模式</button>
        <button class="btn-sheet" id="openSheetBtn" onclick="openSpreadsheet()" title="開啟 Google 試算表">📊 試算表細流</button>
        <button class="btn-success" onclick="saveCurrentToHistory()">💾 封存歷史</button>
        <button class="btn-subtle" onclick="testGentleVoice()">🌸 語音測試</button>
        <button class="btn-pink" onclick="triggerGlobalBroadcast()">📢 全場廣播</button>
      </div>
    </header>

    <!-- 身分專屬篩選列 -->
    <div class="filter-bar">
      <div class="filter-title">
        <span>👤 聚焦幹部：</span>
        <select class="filter-select" id="userRoleFilter" onchange="onFilterChange()">
          <option value="ALL">👀 全部人員（顯示所有人工作）</option>
        </select>
      </div>
      <span style="font-size: 11px; color: #64748b;" id="filterHintText">已顯示全場完整項目</span>
    </div>

    <!-- 主倒數計時看板 -->
    <div class="hero-banner">
      <div class="hero-left">
        <span class="stage-pill" id="stagePillTag">⚡ 當前階段</span>
        <div class="hero-stage-name" id="currentStageName">載入中...</div>
      </div>
      <div class="hero-right">
        <div class="big-timer" id="countdownTimer">--:--</div>
        <div class="next-stage-hint" id="nextStageHint">預計下一階段：--:--</div>
      </div>
    </div>

    <!-- 模式 A：三欄操作版面 (預設) -->
    <div class="main-grid" id="classicViewGrid">
      
      <!-- 欄位 1：細流時間設定 -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">⏱️ 細流流程控制</div>
          <div style="display: flex; gap: 5px;">
            <button class="btn-sheet" onclick="editSpreadsheetUrl()" style="padding: 3px 6px; font-size: 11px;">🔗 試算表</button>
            <button class="btn-slate" onclick="addNewStage()">+ 流程</button>
          </div>
        </div>
        <div class="schedule-list" id="scheduleContainer"></div>
      </div>

      <!-- 欄位 2：自訂組別事項 -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">📋 各組事項與進度</div>
          <div style="display: flex; gap: 5px;">
            <button class="btn-slate" onclick="toggleAllGroupsCollapse()" id="toggleAllCollapseBtn" style="padding: 3px 7px; font-size: 11px;">全部收合</button>
            <button class="btn-warning" onclick="resetAllTaskChecks()" title="保留事項，僅將打勾重設為未完成" style="padding: 3px 7px; font-size: 11px;">🔄 重設打勾</button>
            <button class="btn-slate" onclick="addNewGroup()">+ 組別</button>
          </div>
        </div>
        <div class="groups-container" id="groupsContainer"></div>
      </div>

      <!-- 欄位 3：依負責人彙整清單 -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">👤 個人專屬工作與空窗監測</div>
          <span style="font-size: 10px; color: #64748b;">自動檢測時段空窗</span>
        </div>
        <div class="owner-container" id="ownerContainer"></div>
      </div>

    </div>

    <!-- 模式 B：⏱️ 全局時段一覽表 / 甘特排班矩陣 (Timeline View) -->
    <div class="timeline-view-panel" id="timelineViewPanel">
      <div class="panel-header">
        <div class="panel-title">⏱️ 全員時段排班矩陣（橫向一覽表）</div>
        <span style="font-size: 11px; color: #94a3b8;">清楚掌握每位夥伴在每個時間點該做什麼、誰正處於空閒</span>
      </div>
      <div style="overflow-x: auto;">
        <table class="timeline-table" id="timelineTable">
          <!-- 動態渲染時段矩陣 -->
        </table>
      </div>
    </div>

    <!-- 歷史專區摺疊面板 -->
    <div class="history-panel collapsed" id="historyPanel">
      <div class="history-header" onclick="toggleHistoryPanel()">
        <div class="history-header-title">
          <span class="history-collapse-icon">▼</span>
          <span>📂 活動歷史紀錄與範本庫</span>
          <span style="font-size: 11px; color: #64748b; font-weight: normal;">(點擊展開)</span>
        </div>
        <button class="btn-slate" onclick="event.stopPropagation(); saveCurrentToHistory()">+ 封存目前活動</button>
      </div>
      <div class="history-body">
        <div style="font-size: 11px; color: #64748b;">歷次茶會、社課活動雲端備份，隨時可一鍵還原為工作範本：</div>
        <div class="history-list" id="historyContainer"></div>
      </div>
    </div>

    <footer>高大社團・溫柔控場場佈系統 v14.0 (支援全員時段排班矩陣一覽)</footer>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
      });
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCi6WM8s9rSxxmb8DQw_hB35uxAQCv5hIw",
      authDomain: "nuk-party.firebaseapp.com",
      databaseURL: "https://nuk-party-default-rtdb.firebaseio.com",
      projectId: "nuk-party",
      storageBucket: "nuk-party.firebasestorage.app",
      messagingSenderId: "342555162897",
      appId: "1:342555162897:web:479b44b6d6efd69b73b4b0",
      measurementId: "G-NXMMPR25KG"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const defaultSchedule = [
      { id: 1, name: '集合', time: '17:00', mute: false },
      { id: 2, name: '移動', time: '17:15', mute: false },
      { id: 3, name: '場佈', time: '17:30', mute: false },
      { id: 4, name: '吃晚餐', time: '18:00', mute: false },
      { id: 5, name: '最後準備', time: '18:30', mute: false },
      { id: 6, name: '報到', time: '18:50', mute: true }
    ];

    let schedule = [];
    let groups = [];
    let historyEvents = {};
    let spreadsheetUrl = '';
    let collapsedGroupIds = new Set();
    let areAllCollapsed = false;
    let isProjectorMode = false;
    let currentViewMode = 'classic'; // 'classic' 或 'timeline'
    let currentFilterOwner = 'ALL';
    let announcedMilestones = new Set();
    let initialBroadcastIgnored = false;

    function parseOwners(ownerStr) {
      if (!ownerStr || !ownerStr.trim()) return [];
      return ownerStr.split(/[,，、/／\s]+/).map(s => s.trim()).filter(Boolean);
    }

    function compareTaskTime(a, b) {
      const aStart = a.startTime || a.time || '';
      const bStart = b.startTime || b.time || '';
      if (aStart && bStart) {
        const cmp = aStart.localeCompare(bStart);
        return cmp !== 0 ? cmp : (a.id - b.id);
      }
      if (aStart && !bStart) return -1;
      if (!aStart && bStart) return 1;
      return a.id - b.id;
    }

    function formatTimeLabel(task) {
      const s = task.startTime || task.time || '';
      const e = task.endTime || '';
      if (s && e) return `${s}~${e}`;
      if (s) return `${s}`;
      return '';
    }

    window.onload = function() {
      setInterval(updateClockAndTimer, 1000);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isProjectorMode) {
          toggleProjectorMode();
        }
      });

      db.ref('.info/connected').on('value', (snap) => {
        const el = document.getElementById('syncStatus');
        if (snap.val() === true) {
          el.innerText = '🟢 雲端同步中';
          el.style.color = '#4ade80';
        } else {
          el.innerText = '🔴 斷線重連中';
          el.style.color = '#f87171';
        }
      });

      db.ref('spreadsheet_url').on('value', (snapshot) => {
        spreadsheetUrl = snapshot.val() || '';
        const btn = document.getElementById('openSheetBtn');
        btn.style.opacity = spreadsheetUrl ? '1' : '0.6';
      });

      db.ref('event_schedule').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          schedule = Array.isArray(val) ? val.filter(Boolean) : Object.values(val);
        } else {
          schedule = defaultSchedule;
          db.ref('event_schedule').set(defaultSchedule);
        }
        renderSchedule();
        renderOwnerSummary();
        renderTimelineMatrix();
      });

      db.ref('event_groups').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          const raw = Array.isArray(val) ? val.filter(Boolean) : Object.values(val);
          groups = raw.map(g => ({
            ...g,
            tasks: g.tasks ? (Array.isArray(g.tasks) ? g.tasks.filter(Boolean) : Object.values(g.tasks)) : []
          }));
        } else {
          groups = [];
        }
        updateFilterOptions();
        renderGroups();
        renderOwnerSummary();
        renderTimelineMatrix();
      });

      db.ref('history_events').on('value', (snapshot) => {
        historyEvents = snapshot.val() || {};
        renderHistoryList();
      });

      db.ref('global_broadcast').limitToLast(1).on('child_added', (snapshot) => {
        if (!initialBroadcastIgnored) {
          initialBroadcastIgnored = true;
          return;
        }
        const data = snapshot.val();
        if (data && data.text) {
          gentleAnnounce(data.text);
        }
      });
    };

    function saveScheduleToCloud() { db.ref('event_schedule').set(schedule); }
    function saveGroupsToCloud() { db.ref('event_groups').set(groups); }

    // ⏱️ 切換檢視模式（清單 vs 全局時段一覽）
    function toggleMainViewMode() {
      const classicGrid = document.getElementById('classicViewGrid');
      const timelinePanel = document.getElementById('timelineViewPanel');
      const btn = document.getElementById('viewModeToggleBtn');

      if (currentViewMode === 'classic') {
        currentViewMode = 'timeline';
        classicGrid.style.display = 'none';
        timelinePanel.style.display = 'block';
        btn.innerText = "📋 切換回三欄清單";
        btn.classList.replace('btn-mode-toggle', 'btn-slate');
        renderTimelineMatrix();
      } else {
        currentViewMode = 'classic';
        classicGrid.style.display = 'grid';
        timelinePanel.style.display = 'none';
        btn.innerText = "⏱️ 切換時段矩陣總覽";
        btn.classList.replace('btn-slate', 'btn-mode-toggle');
      }
    }

    // 渲染「全員時段排班矩陣（甘特排程總表）」
    function renderTimelineMatrix() {
      const table = document.getElementById('timelineTable');
      if (!table) return;

      const sortedSchedule = [...schedule].sort((a, b) => a.time.localeCompare(b.time));
      if (sortedSchedule.length === 0) {
        table.innerHTML = `<tr><td style="color:#64748b;">請先在左側建立細流階段。</td></tr>`;
        return;
      }

      // 提取所有幹部名單
      const ownersSet = new Set();
      groups.forEach(g => {
        (g.tasks || []).forEach(t => {
          parseOwners(t.owner).forEach(o => ownersSet.add(o));
        });
      });
      const allOwners = Array.from(ownersSet).sort((a, b) => a.localeCompare(b, 'zh-TW'));

      if (allOwners.length === 0) {
        table.innerHTML = `<tr><td style="color:#64748b;">目前各組尚未建立包含負責人的事項。</td></tr>`;
        return;
      }

      // 建立時段區間列（如 17:00~17:15、17:15~17:30...）
      const timeSlots = [];
      for (let i = 0; i < sortedSchedule.length - 1; i++) {
        timeSlots.push({
          start: sortedSchedule[i].time,
          end: sortedSchedule[i + 1].time,
          name: sortedSchedule[i].name
        });
      }
      // 最後一階段延伸
      const lastStage = sortedSchedule[sortedSchedule.length - 1];
      timeSlots.push({
        start: lastStage.time,
        end: '結束',
        name: lastStage.name
      });

      const now = new Date();
      const nowStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });

      // 建立表頭 Header
      let headerHtml = `
        <thead>
          <tr>
            <th style="min-width: 100px;">幹部人員</th>
            ${timeSlots.map(slot => {
              const isCurrentCol = (slot.end !== '結束' && slot.start <= nowStr && nowStr < slot.end);
              return `
                <th class="${isCurrentCol ? 'current-col' : ''}">
                  <div>${escapeHtml(slot.start)} ~ ${escapeHtml(slot.end)}</div>
                  <div style="font-size:10px; opacity:0.8; margin-top:2px;">【${escapeHtml(slot.name)}】</div>
                </th>
              `;
            }).join('')}
          </tr>
        </thead>
      `;

      // 建立每一位幹部的橫列
      let bodyHtml = '<tbody>';
      allOwners.forEach(owner => {
        // 如果有開啟上方身分篩選且不符，則過濾
        if (currentFilterOwner !== 'ALL' && owner !== currentFilterOwner) return;

        bodyHtml += `<tr>`;
        bodyHtml += `<td class="timeline-person-name">👤 ${escapeHtml(owner)}</td>`;

        timeSlots.forEach(slot => {
          // 搜尋該幹部在此時段內是否有任務
          const matchedTasks = [];
          groups.forEach(group => {
            (group.tasks || []).forEach(task => {
              const owners = parseOwners(task.owner);
              if (!owners.includes(owner)) return;

              const tStart = task.startTime || task.time || '';
              const tEnd = task.endTime || tStart;

              let isCovered = false;
              if (slot.end === '結束') {
                isCovered = (tStart >= slot.start);
              } else {
                isCovered = (tStart < slot.end && tEnd > slot.start) || (tStart >= slot.start && tStart < slot.end);
              }

              if (isCovered) {
                matchedTasks.push({ ...task, groupName: group.name });
              }
            });
          });

          if (matchedTasks.length > 0) {
            const pills = matchedTasks.map(t => `
              <div class="timeline-task-pill ${t.done ? 'is-done' : ''}">
                <div style="font-size:9px; color:#38bdf8;">[${escapeHtml(t.groupName)}]</div>
                <div>${escapeHtml(t.text)}</div>
              </div>
            `).join('');
            bodyHtml += `<td>${pills}</td>`;
          } else {
            bodyHtml += `<td><span class="timeline-idle-cell">空閒</span></td>`;
          }
        });

        bodyHtml += `</tr>`;
      });
      bodyHtml += '</tbody>';

      table.innerHTML = headerHtml + bodyHtml;
    }

    function toggleProjectorMode() {
      isProjectorMode = !isProjectorMode;
      document.body.classList.toggle('projector-mode', isProjectorMode);
      const btn = document.getElementById('projectorToggleBtn');
      
      if (isProjectorMode) {
        btn.innerText = "❌ 退出投影 (Esc)";
        btn.classList.replace('btn-projector', 'btn-pink');
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      } else {
        btn.innerText = "🖥️ 投影模式";
        btn.classList.replace('btn-pink', 'btn-projector');
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

        if (confirm("尚未設定 Google 試算表連結！是否現在貼上？")) editSpreadsheetUrl();
        return;

        spreadsheetUrl = newUrl.trim();

    function saveCurrentToHistory() {
      const name = prompt("請輸入存檔名稱（例：2026/09 迎新茶會）：");
      if (!name || !name.trim()) return;

      const record = {
        name: name.trim(),

    function renderHistoryList() {
      const container = document.getElementById('historyContainer');
      container.innerHTML = '';
      const keys = Object.keys(historyEvents);
      if (keys.length === 0) {
        container.innerHTML = `<div style="color: #64748b; font-size: 11px; grid-column: 1/-1; padding: 6px 0;">尚無歷史紀錄。</div>`;
        return;
      }

      keys.reverse().forEach(key => {

        const card = document.createElement('div');

        card.innerHTML = `
          <div>
            <div class="history-card-top">
              <span class="history-card-name">📌 ${escapeHtml(item.name)}</span>

          </div>
          <div class="history-card-actions">

          </div>

    function loadHistoryRecord(key) {
      const item = historyEvents[key];
      if (!item || !confirm(`確定要將目前畫面替換為「${item.name}」嗎？`)) return;

      const resetChecks = confirm(`是否將所有事項重設為未完成？\n「確定」：清空打勾\n「取消」：保留原進度`);

      let loadedSchedule = item.schedule || defaultSchedule;
      let loadedGroups = item.groups || [];

      if (resetChecks) {
        loadedGroups = loadedGroups.map(g => ({
          ...g,
          tasks: (g.tasks || []).map(t => ({ ...t, done: false }))
        }));
      }

      db.ref('event_schedule').set(loadedSchedule);
      db.ref('event_groups').set(loadedGroups);
      if (item.spreadsheetUrl) db.ref('spreadsheet_url').set(item.spreadsheetUrl);
      alert(`✅ 已成功載入「${item.name}」！`);
    }

    function deleteHistoryRecord(key) {
      const item = historyEvents[key];
      if (confirm(`確定刪除「${item ? item.name : '此紀錄'}」嗎？`)) {
        db.ref(`history_events/${key}`).remove();
      }
    }

    function updateFilterOptions() {
      const select = document.getElementById('userRoleFilter');
      const currentSelected = select.value;
      const owners = new Set();

      groups.forEach(g => {
        (g.tasks || []).forEach(t => {
          parseOwners(t.owner).forEach(name => owners.add(name));
        });
      });

      let optionsHtml = `<option value="ALL">👀 全部人員（顯示所有人工作）</option>`;
      Array.from(owners).sort((a,b) => a.localeCompare(b, 'zh-TW')).forEach(name => {
        optionsHtml += `<option value="${escapeHtml(name)}">👤 僅看：${escapeHtml(name)} 的工作</option>`;
      });

      select.innerHTML = optionsHtml;
      if (Array.from(select.options).some(opt => opt.value === currentSelected)) {
        select.value = currentSelected;
      } else {
        select.value = 'ALL';

    function onFilterChange() {
      currentFilterOwner = document.getElementById('userRoleFilter').value;
      const hint = document.getElementById('filterHintText');
      if (currentFilterOwner === 'ALL') {
        hint.innerText = "已顯示全場完整項目";
        hint.style.color = "#64748b";
      } else {
        hint.innerText = `🔍 僅聚焦：${currentFilterOwner}`;

      renderGroups();
      renderOwnerSummary();

    function updateClockAndTimer() {
      const now = new Date();
      const currentTimeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
      document.getElementById('realtimeClock').innerText = `現在時間：${now.toLocaleTimeString('zh-TW', { hour12: false })}`;

      checkDutyAndOverdueStatus(currentTimeStr);

      if (!schedule || schedule.length === 0) {
        document.getElementById('currentStageName').innerText = "未設定流程";
        document.getElementById('countdownTimer').innerText = "--:--";
        document.getElementById('nextStageHint').innerText = "請在左側新增流程";
        return;
      }

      const sortedSchedule = [...schedule].sort((a, b) => a.time.localeCompare(b.time));
      
      let currentStage = null;
      let nextStage = null;

      for (let i = 0; i < sortedSchedule.length; i++) {
        const itemTime = sortedSchedule[i].time;
        if (currentTimeStr < itemTime) {
          nextStage = sortedSchedule[i];
          currentStage = i > 0 ? sortedSchedule[i - 1] : { name: '準備階段', time: '00:00' };
          break;
        }
      }

      if (!nextStage && sortedSchedule.length > 0) {
        currentStage = sortedSchedule[sortedSchedule.length - 1];
        document.getElementById('stagePillTag').innerText = "🎉 最終階段";
        document.getElementById('currentStageName').innerText = currentStage.name;
        document.getElementById('countdownTimer').innerText = "進行中";
        document.getElementById('nextStageHint').innerText = "今日所有細流已全數開展";
        highlightActiveStage(currentStage.id);
        return;
      }

      highlightActiveStage(currentStage ? currentStage.id : null);
      document.getElementById('stagePillTag').innerText = "⚡ 當前階段";
      document.getElementById('currentStageName').innerText = currentStage ? currentStage.name : '準備中';
      
      const [nh, nm] = nextStage.time.split(':');
      const targetDate = new Date();
      targetDate.setHours(parseInt(nh), parseInt(nm), 0, 0);

      const diffMs = targetDate - now;
      if (diffMs > 0) {
        const totalSec = Math.floor(diffMs / 1000);
        const min = Math.floor(totalSec / 60);
        const sec = totalSec % 60;
        document.getElementById('countdownTimer').innerText = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        document.getElementById('nextStageHint').innerText = `下一階段：${nextStage.name} (${nextStage.time})${nextStage.mute ? ' 🤫' : ''}`;

        const milestoneKey = `${nextStage.name}_${min}`;
        if (min === 5 && sec === 0 && !announcedMilestones.has(milestoneKey)) {
          announcedMilestones.add(milestoneKey);
          if (!nextStage.mute) {
            playGentleChime();
            setTimeout(() => {
              speakGentle(`各位幹部辛苦囉，距離下一個階段『${nextStage.name}』還有五分鐘，請大家把握時間喔。`);
            }, 1200);
          }
        }
      } else {
        const arriveKey = `${nextStage.name}_0`;
        if (!announcedMilestones.has(arriveKey)) {
          announcedMilestones.add(arriveKey);
          if (!nextStage.mute) {
            playGentleChime();
            setTimeout(() => {
              speakGentle(`現在時間 ${nextStage.time}，進入『${nextStage.name}』階段，大家加油！`);
            }, 1200);
          }
        }
      }
    }

    function checkDutyAndOverdueStatus(nowStr) {
      document.querySelectorAll('.task-item[data-task-start]').forEach(itemEl => {
        const isDone = itemEl.getAttribute('data-task-done') === 'true';
        const start = itemEl.getAttribute('data-task-start');
        const end = itemEl.getAttribute('data-task-end') || start;
        const timeTag = itemEl.querySelector('.time-tag');

        if (isDone || !start) {
          itemEl.classList.remove('current-duty');
          if (timeTag) timeTag.classList.remove('overdue');
          return;
        }

        const isCurrentDuty = (start <= nowStr && nowStr <= end);
        if (isCurrentDuty) {
          itemEl.classList.add('current-duty');
        } else {
          itemEl.classList.remove('current-duty');
        }

        if (nowStr > end) {
          if (timeTag) timeTag.classList.add('overdue');
        } else {
          if (timeTag) timeTag.classList.remove('overdue');
        }
      });
    }

    function highlightActiveStage(activeId) {
      document.querySelectorAll('.schedule-item').forEach(el => el.classList.remove('active'));
      if (activeId) {
        const activeEl = document.getElementById(`schedule-item-${activeId}`);
        if (activeEl) activeEl.classList.add('active');
      }
    }

    function playGentleChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.12);
          gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + idx * 0.12 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.12);
          osc.stop(ctx.currentTime + idx * 0.12 + 1.2);
        });
      } catch (e) { console.log(e); }
    }

    function speakGentle(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 0.92;
      utter.pitch = 1.15;
      utter.volume = 0.95;
      const voices = window.speechSynthesis.getVoices();
      const softVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('HsiaoChen') || v.name.includes('Mei-Jia') || v.name.includes('Yating') || v.name.includes('Natural')));
      if (softVoice) utter.voice = softVoice;
      window.speechSynthesis.speak(utter);
    }

    function gentleAnnounce(text) {
      playGentleChime();
      setTimeout(() => speakGentle(text), 1000);
    }

    function testGentleVoice() {
      playGentleChime();
      setTimeout(() => speakGentle("這是在測試溫柔廣播音量，祝今天的活動一切順利喔！"), 1000);
    }

    function triggerGlobalBroadcast() {
      const msg = prompt("請輸入要對全體幹部廣播的內容：", "各位幹部辛苦囉，請大家注意目前的細流時間，加油喔！");
      if (!msg) return;
      db.ref('global_broadcast').push({ text: msg, timestamp: Date.now() });

    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';
      const sorted = [...schedule].sort((a, b) => a.time.localeCompare(b.time));

      sorted.forEach((item) => {
        const isMuted = !!item.mute;
        const div = document.createElement('div');
        div.className = 'schedule-item';
        div.id = `schedule-item-${item.id}`;
        div.innerHTML = `
          <div class="schedule-info">
            <input type="time" value="${item.time}" onchange="updateStageTime(${item.id}, this.value)">
            <span class="schedule-name">${escapeHtml(item.name)}</span>
            <button class="mute-toggle-btn ${isMuted ? 'muted' : ''}" onclick="toggleStageMute(${item.id})">
              ${isMuted ? '🤫 靜音' : '🔔 播報'}
            </button>
          </div>
          <button class="btn-ghost-danger" onclick="deleteStage(${item.id})">✕</button>
        `;
        container.appendChild(div);
      });
    }

    function toggleStageMute(id) {
      const target = schedule.find(s => s.id === id);
      if (target) {
        target.mute = !target.mute;
        saveScheduleToCloud();
      }
    }

    function updateStageTime(id, newTime) {
      const target = schedule.find(s => s.id === id);
      if (target) {
        target.time = newTime;
        saveScheduleToCloud();
      }
    }

    function addNewStage() {
      const name = prompt("請輸入流程名稱（例：隊輔總彩排）：");
      if (!name) return;
      const time = prompt("請輸入開始時間（格式如 17:45）：", "18:00");
      if (!time) return;
      const isMute = confirm("此階段是否預設為「靜音模式」（不播語音，避免打擾學員）？");

      schedule.push({ id: Date.now(), name: name, time: time, mute: isMute });
      saveScheduleToCloud();
    }

    function deleteStage(id) {
      const target = schedule.find(s => s.id === id);
      if (confirm(`確定要刪除「${target ? target.name : '此流程'}」嗎？`)) {
        schedule = schedule.filter(s => s.id !== id);
        saveScheduleToCloud();
      }
    }

    function toggleAllGroupsCollapse() {
      areAllCollapsed = !areAllCollapsed;
      collapsedGroupIds.clear();
      if (areAllCollapsed) {
        groups.forEach(g => collapsedGroupIds.add(g.id));
        document.getElementById('toggleAllCollapseBtn').innerText = "全部展開";
      } else {
        document.getElementById('toggleAllCollapseBtn').innerText = "全部收合";
      }
      renderGroups();
    }

    function renderGroups() {
      const container = document.getElementById('groupsContainer');
      container.innerHTML = '';

      if (groups.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: #64748b; padding: 16px 0; font-size: 12px;">尚未新增組別，點擊右上角「+ 組別」開始建立！</div>`;
        return;
      }

      groups.forEach((group) => {
        const isCollapsed = collapsedGroupIds.has(group.id);
        const allTasks = group.tasks || [];
        const sortedTasks = [...allTasks].sort(compareTaskTime);
        
        const visibleTasks = sortedTasks.filter(task => {
          if (currentFilterOwner === 'ALL') return true;
          return parseOwners(task.owner).includes(currentFilterOwner);
        });

        if (currentFilterOwner !== 'ALL' && visibleTasks.length === 0) return;

        const total = allTasks.length;
        const doneCount = allTasks.filter(t => t.done).length;
        const percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);

        const card = document.createElement('div');
        card.className = `group-card ${isCollapsed ? 'collapsed' : ''}`;
        card.id = `group-card-${group.id}`;
        
        let tasksHtml = '';
        visibleTasks.forEach(task => {
          const owners = parseOwners(task.owner);
          let ownersHtml = owners.length > 0
            ? owners.map(o => `<span class="owner-tag" onclick="editTaskOwner(${group.id}, ${task.id})">👤 ${escapeHtml(o)}</span>`).join(' ')
            : `<span class="owner-tag" style="opacity:0.5;" onclick="editTaskOwner(${group.id}, ${task.id})">+指派</span>`;

          const timeLabel = formatTimeLabel(task);
          const sTime = task.startTime || task.time || '';
          const eTime = task.endTime || sTime;

          tasksHtml += `
            <div class="task-item ${task.done ? 'done' : ''}" 
                 data-task-start="${sTime}" 
                 data-task-end="${eTime}" 
                 data-task-done="${task.done}">
              <div class="task-left">
                <input type="checkbox" ${task.done ? 'checked' : ''} style="cursor:pointer; width:15px; height:15px;" onchange="toggleTask(${group.id}, ${task.id})">
                
                ${timeLabel ? `
                  <span class="time-tag" onclick="editTaskTimeRange(${group.id}, ${task.id})">
                    ⏰ ${timeLabel}
                  </span>
                ` : `
                  <span class="time-tag" style="opacity:0.4; border-style:dashed;" onclick="editTaskTimeRange(${group.id}, ${task.id})">
                    +時段
                  </span>
                `}

                <span class="task-text" onclick="toggleTask(${group.id}, ${task.id})">${escapeHtml(task.text)}</span>
                ${ownersHtml}
              </div>
              <button class="btn-ghost-danger" onclick="deleteTask(${group.id}, ${task.id})">✕</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="group-header" onclick="toggleCollapse(${group.id})">
            <div class="group-title-left">
              <span class="collapse-icon">▼</span>
              <span>📌 ${escapeHtml(group.name)}</span>
            </div>
            <div onclick="event.stopPropagation();">
              <button class="btn-ghost-danger" onclick="deleteGroup(${group.id})" style="font-size:11px;">刪除組別</button>
            </div>
          </div>

          <div class="progress-wrap">
            <div class="progress-meta">
              <span>進度：${doneCount} / ${total}</span>
              <span>${percent}%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${percent}%;"></div>
            </div>
          </div>

          <div class="group-body">
            <div class="task-list">${tasksHtml || '<div style="color:#64748b; font-size:11px; padding:2px 0;">此組無相關事項</div>'}</div>
            <div class="add-box">
              <input type="text" id="input-task-${group.id}" class="input-task-text" placeholder="待辦事項...">
              <input type="text" id="input-owner-${group.id}" class="input-task-owner" placeholder="負責人">
              <div class="time-range-group">
                <input type="time" id="input-stime-${group.id}">
                <span>~</span>
                <input type="time" id="input-etime-${group.id}">
              </div>
              <button class="btn-slate" onclick="addTask(${group.id})">新增</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function findIdleGapsForOwner(ownerTasks, sortedSchedule) {
      if (!sortedSchedule || sortedSchedule.length < 2) return [];
      const idleGaps = [];

      for (let i = 0; i < sortedSchedule.length - 1; i++) {
        const stageA = sortedSchedule[i];
        const stageB = sortedSchedule[i + 1];
        const segStart = stageA.time;
        const segEnd = stageB.time;

        const hasTask = ownerTasks.some(t => {
          const tStart = t.startTime || t.time || '';
          const tEnd = t.endTime || tStart;
          if (!tStart) return false;
          return (tStart < segEnd && tEnd > segStart) || (tStart >= segStart && tStart < segEnd);
        });

        if (!hasTask) idleGaps.push(`${segStart}~${segEnd} (${stageA.name})`);
      }
      return idleGaps;
    }

    function renderOwnerSummary() {
      const container = document.getElementById('ownerContainer');
      container.innerHTML = '';
      const ownerMap = {};

      groups.forEach(group => {
        (group.tasks || []).forEach(task => {
          const owners = parseOwners(task.owner);
          const taskKeys = owners.length > 0 ? owners : ['（未指派負責人）'];

          taskKeys.forEach(ownerKey => {
            if (currentFilterOwner !== 'ALL' && ownerKey !== currentFilterOwner) return;

            if (!ownerMap[ownerKey]) ownerMap[ownerKey] = [];
            ownerMap[ownerKey].push({
              ...task,
              allOwners: owners,
              groupId: group.id,
              groupName: group.name
            });
          });
        });
      });

      const ownerNames = Object.keys(ownerMap);
      if (ownerNames.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: #64748b; padding: 16px 0; font-size: 12px;">目前無符合的事項。</div>`;
        return;
      }

      ownerNames.sort((a, b) => {
        if (a === '（未指派負責人）') return 1;
        if (b === '（未指派負責人）') return -1;
        return a.localeCompare(b, 'zh-TW');
      });

      const sortedSchedule = [...schedule].sort((a, b) => a.time.localeCompare(b.time));

      ownerNames.forEach(owner => {
        const tasks = ownerMap[owner];
        tasks.sort(compareTaskTime);

        const total = tasks.length;
        const doneCount = tasks.filter(t => t.done).length;
        const percent = Math.round((doneCount / total) * 100);

        let idleHtml = '';
        if (owner !== '（未指派負責人）') {
          const gaps = findIdleGapsForOwner(tasks, sortedSchedule);
          if (gaps.length > 0) {
            idleHtml = `
              <div class="idle-alert-box">
                <span>⚠️ 空窗未安排：${escapeHtml(gaps.join('、'))}</span>
              </div>
            `;
          }
        }

        const card = document.createElement('div');
        card.className = 'owner-card';

        let taskItemsHtml = '';
        tasks.forEach(t => {
          const partnerNames = t.allOwners.filter(o => o !== owner);
          const partnerHint = partnerNames.length > 0 ? `<span style="font-size:10px; color:#64748b;">(${escapeHtml(partnerNames.join(','))})</span>` : '';
          const timeLabel = formatTimeLabel(t);
          const sTime = t.startTime || t.time || '';
          const eTime = t.endTime || sTime;

          taskItemsHtml += `
            <div class="task-item ${t.done ? 'done' : ''}"
                 data-task-start="${sTime}" 
                 data-task-end="${eTime}" 
                 data-task-done="${t.done}">
              <div class="task-left">
                <input type="checkbox" ${t.done ? 'checked' : ''} style="cursor:pointer; width:15px; height:15px;" onchange="toggleTask(${t.groupId}, ${t.id})">
                <span class="owner-task-badge">${escapeHtml(t.groupName)}</span>
                ${timeLabel ? `<span class="time-tag">⏰ ${timeLabel}</span>` : ''}
                <span class="task-text" onclick="toggleTask(${t.groupId}, ${t.id})">${escapeHtml(t.text)}</span>
                ${partnerHint}
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="owner-card-header">
            <div class="owner-card-title">
              <span>👤 ${escapeHtml(owner)}</span>
            </div>
            <span style="font-size: 11px; color: ${percent === 100 ? '#4ade80' : '#94a3b8'}; font-weight: 600;">
              ${doneCount}/${total} (${percent}%)
            </span>
          </div>

          <div class="progress-bar-bg" style="margin-bottom: 7px;">
            <div class="progress-bar-fill" style="width: ${percent}%; background: linear-gradient(90deg, #c084fc, #f472b6);"></div>
          </div>

          <div class="task-list" style="margin-bottom: 0;">
            ${taskItemsHtml}
          </div>
          ${idleHtml}
        `;
        container.appendChild(card);
      });
    }

    function toggleCollapse(groupId) {
      if (collapsedGroupIds.has(groupId)) {
        collapsedGroupIds.delete(groupId);
      } else {
        collapsedGroupIds.add(groupId);
      }
      renderGroups();
    }

    function addNewGroup() {
      const groupName = prompt("請輸入組別名稱（例：場務組、器材組、隊輔組）：");
      if (!groupName) return;
      groups.push({ id: Date.now(), name: groupName, tasks: [] });
      saveGroupsToCloud();
    }

    function deleteGroup(groupId) {
      const target = groups.find(g => g.id === groupId);
      if (confirm(`確定要刪除「${target ? target.name : '此組別'}」及其所有事項嗎？`)) {
        groups = groups.filter(g => g.id !== groupId);
        saveGroupsToCloud();
      }
    }

    function addTask(groupId) {
      const taskInput = document.getElementById(`input-task-${groupId}`);
      const ownerInput = document.getElementById(`input-owner-${groupId}`);
      const stimeInput = document.getElementById(`input-stime-${groupId}`);
      const etimeInput = document.getElementById(`input-etime-${groupId}`);
      const text = taskInput.value.trim();
      const owner = ownerInput.value.trim();
      const sTime = stimeInput.value;
      const eTime = etimeInput.value;
      if (!text) return;

      const group = groups.find(g => g.id === groupId);
      if (group) {
        if (!group.tasks) group.tasks = [];
        group.tasks.push({
          id: Date.now(),
          text: text,
          owner: owner,
          startTime: sTime || '',
          endTime: eTime || '',
          done: false
        });
        saveGroupsToCloud();
      }
    }

    function editTaskOwner(groupId, taskId) {
      const group = groups.find(g => g.id === groupId);
      if (!group || !group.tasks) return;
      const task = group.tasks.find(t => t.id === taskId);
      if (!task) return;

      const newOwner = prompt(`更換「${task.text}」的負責人（可填多人，用逗號或空格分開）：`, task.owner || '');
      if (newOwner !== null) {
        task.owner = newOwner.trim();
        saveGroupsToCloud();
      }
    }

    function editTaskTimeRange(groupId, taskId) {
      const group = groups.find(g => g.id === groupId);
      if (!group || !group.tasks) return;
      const task = group.tasks.find(t => t.id === taskId);
      if (!task) return;

      const curStart = task.startTime || task.time || '';
      const curEnd = task.endTime || '';

      const newStart = prompt(`設定開始時間（格式如 12:30）：\n（留空按確定可清除）`, curStart);
      if (newStart === null) return;

      let newEnd = '';
      if (newStart.trim() !== '') {
        const promptEnd = prompt(`設定結束時間（格式如 12:40，可選填）：`, curEnd);
        if (promptEnd !== null) newEnd = promptEnd.trim();
      }

      task.startTime = newStart.trim();
      task.endTime = newEnd;
      delete task.time;
      saveGroupsToCloud();
    }

    function toggleTask(groupId, taskId) {
      const group = groups.find(g => g.id === groupId);
      if (group && group.tasks) {
        const task = group.tasks.find(t => t.id === taskId);
        if (task) {
          task.done = !task.done;
          saveGroupsToCloud();
        }
      }
    }

    function deleteTask(groupId, taskId) {
      const group = groups.find(g => g.id === groupId);
      if (group && group.tasks) {
        const task = group.tasks.find(t => t.id === taskId);
        if (confirm(`確定要刪除事項「${task ? task.text : '此事項'}」嗎？`)) {
          group.tasks = group.tasks.filter(t => t.id !== taskId);
          saveGroupsToCloud();
        }
      }
    }

    function resetAllTaskChecks() {
      if (confirm("確定要將「所有組別」的打勾狀態全部清空重設嗎？\n（組別和事項完整保留，僅重設進度）")) {
        groups.forEach(group => {
          if (group.tasks) group.tasks.forEach(t => t.done = false);
        });
        saveGroupsToCloud();
      }
    }

    function escapeHtml(string) {
      return String(string || '').replace(/[&<>"']/g, function (s) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[s];
      });
    }
  </script>
</body>
</html>
