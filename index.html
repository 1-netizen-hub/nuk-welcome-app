<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動細流與場佈倒數系統</title>

  <!-- PWA 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="活動指揮中樞">
  <link rel="apple-touch-icon" href="icon-512.png">

  <!-- 引入 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    body { background-color: #121318; color: #f1f5f9; min-height: 100vh; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    
    .container { width: 100%; max-width: 1300px; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #2e3440; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .title-area h1 { font-size: 20px; color: #f472b6; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sync-status { font-size: 11px; background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); padding: 2px 8px; border-radius: 999px; font-weight: 500; }
    .clock-display { font-size: 13px; color: #94a3b8; margin-top: 4px; font-family: monospace; }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    button { cursor: pointer; border: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
    button:active { transform: scale(0.97); }
    .btn-pink { background: #db2777; color: white; }
    .btn-pink:hover { background: #be185d; }
    .btn-slate { background: #334155; color: #f1f5f9; }
    .btn-slate:hover { background: #475569; }
    .btn-subtle { background: rgba(244, 114, 182, 0.15); color: #f472b6; border: 1px solid rgba(244, 114, 182, 0.3); }
    .btn-subtle:hover { background: rgba(244, 114, 182, 0.25); }
    .btn-warning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .btn-warning:hover { background: rgba(245, 158, 11, 0.3); }
    .btn-success { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .btn-success:hover { background: rgba(34, 197, 94, 0.3); }
    .btn-danger { background: #991b1b; color: #fecaca; padding: 3px 6px; font-size: 11px; }

    /* 身分篩選專區 */
    .filter-bar { background: #1e1b2e; border: 1px solid #3b0764; border-radius: 12px; padding: 10px 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .filter-title { font-size: 14px; font-weight: 600; color: #f472b6; display: flex; align-items: center; gap: 6px; }
    .filter-select { background: #121318; border: 1px solid #6366f1; color: #f1f5f9; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; outline: none; cursor: pointer; }

    /* 主倒數計時大畫幅 */
    .hero-banner { background: linear-gradient(135deg, #1e1b2e 0%, #172554 100%); border: 1px solid #3b0764; border-radius: 16px; padding: 24px 16px; text-align: center; margin-bottom: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); }
    .stage-badge { display: inline-block; background: rgba(244, 114, 182, 0.2); color: #f472b6; padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 8px; border: 1px solid rgba(244, 114, 182, 0.3); }
    .big-timer { font-size: clamp(52px, 10vw, 84px); font-weight: 800; font-family: monospace; color: #fb7185; letter-spacing: -2px; line-height: 1; margin: 8px 0; text-shadow: 0 0 20px rgba(251, 113, 133, 0.3); }
    .next-stage-hint { color: #cbd5e1; font-size: 14px; margin-top: 4px; }

    /* 三欄排版架構 */
    .main-grid { display: grid; grid-template-columns: 1fr 1.2fr 1.1fr; gap: 18px; margin-bottom: 24px; }
    @media (max-width: 1050px) { .main-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

    .panel { background: #18181b; border: 1px solid #27272a; border-radius: 14px; padding: 16px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid #27272a; padding-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .panel-title { font-size: 15px; font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 8px; }

    /* Schedule Section */
    .schedule-list { display: flex; flex-direction: column; gap: 10px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
    .schedule-item { display: flex; align-items: center; justify-content: space-between; background: #27272a; padding: 10px 12px; border-radius: 10px; border-left: 4px solid #64748b; }
    .schedule-item.active { border-left-color: #f472b6; background: #2d1d29; }
    .schedule-info { display: flex; align-items: center; gap: 8px; flex-grow: 1; flex-wrap: wrap; }
    .schedule-name { font-weight: 600; font-size: 14px; }
    input[type="time"] { background: #18181b; color: #f8fafc; border: 1px solid #3f3f46; border-radius: 6px; padding: 3px 6px; font-size: 12px; }

    .mute-toggle-btn { background: transparent; border: 1px solid #3f3f46; border-radius: 6px; padding: 3px 6px; font-size: 12px; color: #94a3b8; cursor: pointer; }
    .mute-toggle-btn.muted { color: #f87171; border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.1); }

    /* Groups Section */
    .groups-container { display: flex; flex-direction: column; gap: 14px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
    .group-card { background: #27272a; border-radius: 10px; padding: 12px 14px; border: 1px solid #3f3f46; transition: all 0.2s ease; }
    
    .group-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .group-title-left { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #38bdf8; }
    .collapse-icon { font-size: 12px; transition: transform 0.2s ease; color: #94a3b8; }
    .group-card.collapsed .collapse-icon { transform: rotate(-90deg); }
    .group-card.collapsed .group-body { display: none; }

    /* 進度條 */
    .progress-wrap { margin-top: 8px; margin-bottom: 10px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .progress-bar-bg { width: 100%; height: 5px; background: #18181b; border-radius: 999px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #4ade80); width: 0%; transition: width 0.3s ease; }

    .task-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #e2e8f0; background: #18181b; padding: 7px 10px; border-radius: 6px; gap: 8px; }
    .task-item.done span.task-text { text-decoration: line-through; color: #64748b; }
    .task-left { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-grow: 1; flex-wrap: wrap; }
    
    /* 標籤 */
    .owner-tag { font-size: 11px; background: rgba(148, 163, 184, 0.15); color: #cbd5e1; padding: 2px 7px; border-radius: 4px; border: 1px solid rgba(148, 163, 184, 0.25); white-space: nowrap; cursor: pointer; }
    .owner-tag:hover { background: rgba(148, 163, 184, 0.3); border-color: #38bdf8; }

    /* 時段區間標籤 */
    .time-tag { font-size: 11px; background: rgba(56, 189, 248, 0.12); color: #38bdf8; padding: 2px 7px; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.25); white-space: nowrap; cursor: pointer; font-family: monospace; }
    .time-tag:hover { background: rgba(56, 189, 248, 0.25); }
    .time-tag.overdue { background: rgba(239, 68, 68, 0.25); color: #f87171; border-color: #ef4444; font-weight: bold; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .add-box { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
    .add-box input[type="text"], .add-box input[type="time"] { background: #18181b; border: 1px solid #3f3f46; color: white; border-radius: 6px; padding: 5px 8px; font-size: 12px; }
    .input-task-text { flex-grow: 1; min-width: 130px; }
    .input-task-owner { width: 90px; }
    .time-range-group { display: flex; align-items: center; gap: 3px; font-size: 11px; color: #94a3b8; }

    /* 負責人彙整卡片 */
    .owner-container { display: flex; flex-direction: column; gap: 12px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
    .owner-card { background: #27272a; border-radius: 10px; padding: 12px 14px; border: 1px solid #3f3f46; }
    .owner-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .owner-card-title { font-size: 14px; font-weight: 700; color: #a78bfa; display: flex; align-items: center; gap: 6px; }
    .owner-task-badge { font-size: 10px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 1px 5px; border-radius: 4px; }

    /* 空窗閒置提醒框 */
    .idle-alert-box { background: rgba(245, 158, 11, 0.1); border: 1px dashed rgba(245, 158, 11, 0.4); border-radius: 6px; padding: 6px 10px; font-size: 11px; color: #fbbf24; margin-top: 6px; display: flex; align-items: center; gap: 6px; }

    /* 歷史專區摺疊面板 */
    .history-panel { background: #18181b; border: 1px solid #3b0764; border-radius: 14px; padding: 16px; margin-bottom: 24px; transition: all 0.2s ease; }
    .history-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .history-header-title { font-size: 15px; font-weight: 700; color: #c084fc; display: flex; align-items: center; gap: 8px; }
    .history-panel.collapsed .history-body { display: none; }
    .history-panel.collapsed .history-collapse-icon { transform: rotate(-90deg); }
    .history-collapse-icon { font-size: 12px; transition: transform 0.2s ease; color: #94a3b8; }
    
    .history-body { margin-top: 14px; border-top: 1px solid #27272a; padding-top: 12px; }
    .history-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 10px; }
    .history-card { background: #27272a; border: 1px solid #3f3f46; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
    .history-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .history-card-name { font-weight: 700; font-size: 14px; color: #f1f5f9; }
    .history-card-date { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .history-card-desc { font-size: 12px; color: #cbd5e1; }
    .history-card-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }

    footer { margin-top: 10px; font-size: 12px; text-align: center; color: #64748b; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-area">
        <h1>🌸 活動細流與場佈指揮中樞 <span class="sync-status" id="syncStatus">🟢 雲端同步中</span></h1>
        <div class="clock-display" id="realtimeClock">現在時間：--:--:--</div>
      </div>
      <div class="header-actions">
        <button class="btn-success" onclick="saveCurrentToHistory()">💾 封存為歷史紀錄</button>
        <button class="btn-subtle" onclick="testGentleVoice()">🌸 語音測試</button>
        <button class="btn-pink" onclick="triggerGlobalBroadcast()">📢 全場廣播</button>
      </div>
    </header>

    <!-- 身分專屬篩選列 -->
    <div class="filter-bar">
      <div class="filter-title">
        <span>👤 我是幹部：</span>
        <select class="filter-select" id="userRoleFilter" onchange="onFilterChange()">
          <option value="ALL">👀 全部人員（顯示所有人工作）</option>
        </select>
      </div>
      <span style="font-size: 12px; color: #94a3b8;" id="filterHintText">已顯示全場完整項目</span>
    </div>

    <!-- 主倒數計時大畫幅 -->
    <div class="hero-banner">
      <div class="stage-badge" id="currentStageBadge">階段：載入中</div>
      <div class="big-timer" id="countdownTimer">00:00</div>
      <div class="next-stage-hint" id="nextStageHint">預計下一階段：--:--</div>
    </div>

    <!-- 三欄版面 -->
    <div class="main-grid">
      
      <!-- 欄位 1：細流時間設定 -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">⏱️ 細流流程控制</div>
          <button class="btn-slate" onclick="addNewStage()">+ 流程</button>
        </div>
        <div class="schedule-list" id="scheduleContainer"></div>
      </div>

      <!-- 欄位 2：自訂組別事項 -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">📋 各組事項與進度</div>
          <div style="display: flex; gap: 6px;">
            <button class="btn-warning" onclick="resetAllTaskChecks()" title="保留事項，僅將打勾重設為未完成">🔄 重設打勾</button>
            <button class="btn-slate" onclick="addNewGroup()">+ 組別</button>
          </div>
        </div>
        <div class="groups-container" id="groupsContainer"></div>
      </div>

      <!-- 欄位 3：依負責人彙整清單（含空窗提醒） -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">👤 個人專屬工作與空窗監測</div>
          <span style="font-size: 11px; color: #94a3b8;">自動檢測時段空窗</span>
        </div>
        <div class="owner-container" id="ownerContainer"></div>
      </div>

    </div>

    <!-- 歷史專區摺疊面板 -->
    <div class="history-panel collapsed" id="historyPanel">
      <div class="history-header" onclick="toggleHistoryPanel()">
        <div class="history-header-title">
          <span class="history-collapse-icon">▼</span>
          <span>📂 活動歷史紀錄與範本庫</span>
          <span style="font-size: 11px; color: #94a3b8; font-weight: normal;">(點擊展開/收合)</span>
        </div>
        <button class="btn-slate" onclick="event.stopPropagation(); saveCurrentToHistory()">+ 封存目前活動</button>
      </div>
      <div class="history-body">
        <div style="font-size: 12px; color: #94a3b8;">可將歷次茶會、社課活動封存至雲端，往後隨時一鍵還原為工作範本：</div>
        <div class="history-list" id="historyContainer"></div>
      </div>
    </div>

    <footer>高大社團・溫柔控場場佈系統 v10.0 (支援時段區間與幹部空窗閒置檢測)</footer>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
      });
    }

    const firebaseConfig = {
      apiKey: "AIzaSyCi6WM8s9rSxxmb8DQw_hB35uxAQCv5hIw",
      authDomain: "nuk-party.firebaseapp.com",
      databaseURL: "https://nuk-party-default-rtdb.firebaseio.com",
      projectId: "nuk-party",
      storageBucket: "nuk-party.firebasestorage.app",
      messagingSenderId: "342555162897",
      appId: "1:342555162897:web:479b44b6d6efd69b73b4b0",
      measurementId: "G-NXMMPR25KG"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const defaultSchedule = [
      { id: 1, name: '集合', time: '17:00', mute: false },
      { id: 2, name: '移動', time: '17:15', mute: false },
      { id: 3, name: '場佈', time: '17:30', mute: false },
      { id: 4, name: '吃晚餐', time: '18:00', mute: false },
      { id: 5, name: '最後準備', time: '18:30', mute: false },
      { id: 6, name: '報到', time: '18:50', mute: true }
    ];

    let schedule = [];
    let groups = [];
    let historyEvents = {};
    let collapsedGroupIds = new Set();
    let currentFilterOwner = 'ALL';
    let announcedMilestones = new Set();
    let initialBroadcastIgnored = false;

    function parseOwners(ownerStr) {
      if (!ownerStr || !ownerStr.trim()) return [];
      return ownerStr.split(/[,，、/／\s]+/).map(s => s.trim()).filter(Boolean);
    }

    // 時間格式化與比較
    function compareTaskTime(a, b) {
      const aStart = a.startTime || a.time || '';
      const bStart = b.startTime || b.time || '';
      if (aStart && bStart) {
        const cmp = aStart.localeCompare(bStart);
        return cmp !== 0 ? cmp : (a.id - b.id);
      }
      if (aStart && !bStart) return -1;
      if (!aStart && bStart) return 1;
      return a.id - b.id;
    }

    function formatTimeLabel(task) {
      const s = task.startTime || task.time || '';
      const e = task.endTime || '';
      if (s && e) return `${s} ~ ${e}`;
      if (s) return `${s}`;
      return '';
    }

    window.onload = function() {
      setInterval(updateClockAndTimer, 1000);

      db.ref('.info/connected').on('value', (snap) => {
        const el = document.getElementById('syncStatus');
        if (snap.val() === true) {
          el.innerText = '🟢 雲端同步中';
          el.style.color = '#4ade80';
        } else {
          el.innerText = '🔴 斷線重連中';
          el.style.color = '#f87171';
        }
      });

      db.ref('event_schedule').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          schedule = Array.isArray(val) ? val.filter(Boolean) : Object.values(val);
        } else {
          schedule = defaultSchedule;
          db.ref('event_schedule').set(defaultSchedule);
        }
        renderSchedule();
        renderOwnerSummary();
      });

      db.ref('event_groups').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          const raw = Array.isArray(val) ? val.filter(Boolean) : Object.values(val);
          groups = raw.map(g => ({
            ...g,
            tasks: g.tasks ? (Array.isArray(g.tasks) ? g.tasks.filter(Boolean) : Object.values(g.tasks)) : []
          }));
        } else {
          groups = [];
        }
        updateFilterOptions();
        renderGroups();
        renderOwnerSummary();
      });

      db.ref('history_events').on('value', (snapshot) => {
        historyEvents = snapshot.val() || {};
        renderHistoryList();
      });

      db.ref('global_broadcast').limitToLast(1).on('child_added', (snapshot) => {
        if (!initialBroadcastIgnored) {
          initialBroadcastIgnored = true;
          return;
        }
        const data = snapshot.val();
        if (data && data.text) {
          gentleAnnounce(data.text);
        }
      });
    };

    function saveScheduleToCloud() { db.ref('event_schedule').set(schedule); }
    function saveGroupsToCloud() { db.ref('event_groups').set(groups); }

    // 歷史紀錄相關
    function toggleHistoryPanel() {
      document.getElementById('historyPanel').classList.toggle('collapsed');
    }

    function saveCurrentToHistory() {
      const name = prompt("請輸入此活動的存檔名稱（例：2026/09 迎新茶會、第1次社課）：");
      if (!name || !name.trim()) return;

      const dateStr = new Date().toLocaleString('zh-TW', { hour12: false });
      const record = {
        name: name.trim(),
        savedAt: dateStr,
        schedule: schedule,
        groups: groups
      };

      db.ref('history_events').push(record, (err) => {
        if (!err) alert(`🎉 成功封存「${name.trim()}」至歷史庫！`);
      });
    }

    function renderHistoryList() {
      const container = document.getElementById('historyContainer');
      container.innerHTML = '';

      const keys = Object.keys(historyEvents);
      if (keys.length === 0) {
        container.innerHTML = `<div style="color: #64748b; font-size: 13px; grid-column: 1/-1; padding: 10px 0;">尚無歷史紀錄。辦完活動後點擊「封存目前活動」即可建立範本。</div>`;
        return;
      }

      keys.reverse().forEach(key => {
        const item = historyEvents[key];
        const scheduleCount = (item.schedule || []).length;
        const groupCount = (item.groups || []).length;

        const card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = `
          <div>
            <div class="history-card-top">
              <span class="history-card-name">📌 ${escapeHtml(item.name)}</span>
            </div>
            <div class="history-card-date">🕒 存檔時間：${escapeHtml(item.savedAt || '--')}</div>
            <div class="history-card-desc" style="margin-top: 6px;">
              包含 ${scheduleCount} 個流程階段、${groupCount} 個工作組別
            </div>
          </div>
          <div class="history-card-actions">
            <button class="btn-slate" onclick="loadHistoryRecord('${key}')">📂 載入此活動</button>
            <button class="btn-danger" onclick="deleteHistoryRecord('${key}')">刪除</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function loadHistoryRecord(key) {
      const item = historyEvents[key];
      if (!item) return;

      if (!confirm(`確定要將目前畫面替換為「${item.name}」嗎？`)) return;

      let loadedSchedule = item.schedule || defaultSchedule;

          ...g,
          tasks: (g.tasks || []).map(t => ({ ...t, done: false }))
        }));

    // 時鐘與倒數
    function updateClockAndTimer() {
      const now = new Date();
      document.getElementById('realtimeClock').innerText = `現在時間：${now.toLocaleTimeString('zh-TW', { hour12: false })}`;

      checkTaskOverdue(now);

      if (!schedule || schedule.length === 0) {
        document.getElementById('currentStageBadge').innerText = "未設定流程";
        document.getElementById('countdownTimer').innerText = "--:--";
        document.getElementById('nextStageHint').innerText = "請在左側新增細流流程";
        return;
      }

      const sortedSchedule = [...schedule].sort((a, b) => a.time.localeCompare(b.time));
      const currentTimeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
      
      let currentStage = null;
      let nextStage = null;

      for (let i = 0; i < sortedSchedule.length; i++) {
        const itemTime = sortedSchedule[i].time;
        if (currentTimeStr < itemTime) {
          nextStage = sortedSchedule[i];
          currentStage = i > 0 ? sortedSchedule[i - 1] : { name: '準備階段', time: '00:00' };
          break;
        }
      }

      if (!nextStage && sortedSchedule.length > 0) {
        currentStage = sortedSchedule[sortedSchedule.length - 1];
        document.getElementById('currentStageBadge').innerText = `當前階段：${currentStage.name}`;
        document.getElementById('countdownTimer').innerText = "進行中";
        document.getElementById('nextStageHint').innerText = "所有細流階段已展開";
        highlightActiveStage(currentStage.id);
        return;
      }

      highlightActiveStage(currentStage ? currentStage.id : null);
      document.getElementById('currentStageBadge').innerText = `當前階段：${currentStage ? currentStage.name : '準備中'}`;
      
      const [nh, nm] = nextStage.time.split(':');
      const targetDate = new Date();
      targetDate.setHours(parseInt(nh), parseInt(nm), 0, 0);

      const diffMs = targetDate - now;
      if (diffMs > 0) {
        const totalSec = Math.floor(diffMs / 1000);
        const min = Math.floor(totalSec / 60);
        const sec = totalSec % 60;
        document.getElementById('countdownTimer').innerText = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        document.getElementById('nextStageHint').innerText = `下一階段：${nextStage.name} (${nextStage.time})${nextStage.mute ? ' 🤫靜音模式' : ''}`;

        const milestoneKey = `${nextStage.name}_${min}`;
        if (min === 5 && sec === 0 && !announcedMilestones.has(milestoneKey)) {
          announcedMilestones.add(milestoneKey);
          if (!nextStage.mute) {
            playGentleChime();
            setTimeout(() => {
              speakGentle(`各位幹部辛苦囉，距離下一個階段『${nextStage.name}』還有五分鐘，請大家把握時間喔。`);
            }, 1200);
          }
        }
      } else {
        const arriveKey = `${nextStage.name}_0`;
        if (!announcedMilestones.has(arriveKey)) {
          announcedMilestones.add(arriveKey);
          if (!nextStage.mute) {
            playGentleChime();
            setTimeout(() => {
              speakGentle(`現在時間 ${nextStage.time}，進入『${nextStage.name}』階段，大家加油！`);
            }, 1200);
          }
        }
      }
    }

    function checkTaskOverdue(now) {
      const nowStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
      document.querySelectorAll('.time-tag[data-deadline]').forEach(el => {
        const deadline = el.getAttribute('data-deadline');
        const isDone = el.getAttribute('data-done') === 'true';
        if (!isDone && deadline && nowStr > deadline) {
          el.classList.add('overdue');
          el.title = "⚠️ 此任務時段已超過預計結束時間！";
        } else {
          el.classList.remove('overdue');
          el.title = "點擊可修改時段";
        }
      });
    }

    function highlightActiveStage(activeId) {
      document.querySelectorAll('.schedule-item').forEach(el => el.classList.remove('active'));
      if (activeId) {
        const activeEl = document.getElementById(`schedule-item-${activeId}`);
        if (activeEl) activeEl.classList.add('active');
      }
    }

    function playGentleChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.12);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + idx * 0.12 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.12);
          osc.stop(ctx.currentTime + idx * 0.12 + 1.2);
        });
      } catch (e) { console.log(e); }
    }

    function speakGentle(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 0.92;
      utter.pitch = 1.15;
      utter.volume = 0.95;
      const voices = window.speechSynthesis.getVoices();
      const softVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('HsiaoChen') || v.name.includes('Mei-Jia') || v.name.includes('Yating') || v.name.includes('Natural')));
      if (softVoice) utter.voice = softVoice;
      window.speechSynthesis.speak(utter);
    }

    function gentleAnnounce(text) {
      playGentleChime();
      setTimeout(() => speakGentle(text), 1000);
    }

    function testGentleVoice() {
      playGentleChime();
      setTimeout(() => speakGentle("這是在測試溫柔廣播音量，祝今天的活動一切順利喔！"), 1000);
    }

    // 各組事項管理（時段區間）
    function renderGroups() {
      const container = document.getElementById('groupsContainer');
      container.innerHTML = '';

      if (groups.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: #64748b; padding: 20px 0; font-size: 13px;">尚未新增組別，點擊右上角「+ 組別」開始建立！</div>`;
        return;
      }

      groups.forEach((group) => {
        const isCollapsed = collapsedGroupIds.has(group.id);
        const allTasks = group.tasks || [];
        const sortedTasks = [...allTasks].sort(compareTaskTime);
        
        const visibleTasks = sortedTasks.filter(task => {
          if (currentFilterOwner === 'ALL') return true;
          const owners = parseOwners(task.owner);
          return owners.includes(currentFilterOwner);
        });

          return;

        const total = allTasks.length;
        const doneCount = allTasks.filter(t => t.done).length;
        const percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);

        const card = document.createElement('div');
        card.className = `group-card ${isCollapsed ? 'collapsed' : ''}`;
        card.id = `group-card-${group.id}`;
        
        let tasksHtml = '';

          let ownersHtml = '';
          if (owners.length > 0) {
            ownersHtml = owners.map(o => `<span class="owner-tag" onclick="editTaskOwner(${group.id}, ${task.id})">👤 ${escapeHtml(o)}</span>`).join(' ');
          } else {
            ownersHtml = `<span class="owner-tag" onclick="editTaskOwner(${group.id}, ${task.id})">👤 指派</span>`;
          }

          const timeLabel = formatTimeLabel(task);

          tasksHtml += `

                <input type="checkbox" ${task.done ? 'checked' : ''} style="cursor:pointer;" onchange="toggleTask(${group.id}, ${task.id})">
                
                ${timeLabel ? `

                  </span>

              </div>
              <button class="btn-danger" onclick="deleteTask(${group.id}, ${task.id})">✕</button>
            </div>
          `;

        card.innerHTML = `
          <div class="group-header" onclick="toggleCollapse(${group.id})">

            </div>

              <button class="btn-danger" onclick="deleteGroup(${group.id})">刪除</button>

    // 計算某負責人在各細流時段是否有空窗
    function findIdleGapsForOwner(ownerTasks, sortedSchedule) {
      if (!sortedSchedule || sortedSchedule.length < 2) return [];

      const idleGaps = [];

      for (let i = 0; i < sortedSchedule.length - 1; i++) {
        const stageA = sortedSchedule[i];
        const stageB = sortedSchedule[i + 1];
        const segStart = stageA.time;
        const segEnd = stageB.time;

        // 檢查該幹部在 segStart ~ segEnd 之間是否有任務覆蓋
        const hasTask = ownerTasks.some(t => {
          const tStart = t.startTime || t.time || '';
          const tEnd = t.endTime || tStart;
          if (!tStart) return false;

          // 若任務時間與細流區間有重疊即視為有事做
          return (tStart < segEnd && tEnd > segStart) || (tStart >= segStart && tStart < segEnd);
        });

        if (!hasTask) {
          idleGaps.push(`${segStart}~${segEnd} (${stageA.name}時段)`);
        }
      }

      return idleGaps;
    }

    // 負責人看板（含空窗提醒）
    function renderOwnerSummary() {
      const container = document.getElementById('ownerContainer');
      container.innerHTML = '';

      const ownerMap = {};

      groups.forEach(group => {
        (group.tasks || []).forEach(task => {
          const owners = parseOwners(task.owner);
          const taskKeys = owners.length > 0 ? owners : ['（未指派負責人）'];

          taskKeys.forEach(ownerKey => {
            if (currentFilterOwner !== 'ALL' && ownerKey !== currentFilterOwner) {
              return;
            }

            if (!ownerMap[ownerKey]) {
              ownerMap[ownerKey] = [];
            }
            ownerMap[ownerKey].push({
              ...task,
              allOwners: owners,
              groupId: group.id,
              groupName: group.name
            });
          });
        });
      });

      const ownerNames = Object.keys(ownerMap);
      if (ownerNames.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: #64748b; padding: 20px 0; font-size: 13px;">目前無符合的事項。</div>`;
        return;
      }

      ownerNames.sort((a, b) => {
        if (a === '（未指派負責人）') return 1;
        if (b === '（未指派負責人）') return -1;
        return a.localeCompare(b, 'zh-TW');
      });

      const sortedSchedule = [...schedule].sort((a, b) => a.time.localeCompare(b.time));

      ownerNames.forEach(owner => {
        const tasks = ownerMap[owner];
        tasks.sort(compareTaskTime);

        const total = tasks.length;
        const doneCount = tasks.filter(t => t.done).length;
        const percent = Math.round((doneCount / total) * 100);

        // 空窗檢測（針對具體名字的幹部進行細流時間覆蓋檢測）
        let idleHtml = '';
        if (owner !== '（未指派負責人）') {
          const gaps = findIdleGapsForOwner(tasks, sortedSchedule);
          if (gaps.length > 0) {
            idleHtml = `
              <div class="idle-alert-box">
                <span>⚠️ 空窗未安排：${escapeHtml(gaps.join('、'))}</span>
              </div>
            `;
          }
        }

        const card = document.createElement('div');
        card.className = 'owner-card';

        let taskItemsHtml = '';
        tasks.forEach(t => {
          const partnerNames = t.allOwners.filter(o => o !== owner);
          const partnerHint = partnerNames.length > 0 ? `<span style="font-size:10px; color:#94a3b8;">(與 ${escapeHtml(partnerNames.join(','))} 合作)</span>` : '';
          const timeLabel = formatTimeLabel(t);
          const deadlineTime = t.endTime || t.startTime || t.time || '';

          taskItemsHtml += `
            <div class="task-item ${t.done ? 'done' : ''}">
              <div class="task-left">
                <input type="checkbox" ${t.done ? 'checked' : ''} style="cursor:pointer;" onchange="toggleTask(${t.groupId}, ${t.id})">
                <span class="owner-task-badge">${escapeHtml(t.groupName)}</span>
                ${timeLabel ? `<span class="time-tag" data-deadline="${deadlineTime}" data-done="${t.done}">⏰ ${timeLabel}</span>` : ''}
                <span class="task-text" onclick="toggleTask(${t.groupId}, ${t.id})">${escapeHtml(t.text)}</span>
                ${partnerHint}
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="owner-card-header">
            <div class="owner-card-title">
              <span>👤 ${escapeHtml(owner)}</span>
            </div>
            <span style="font-size: 11px; color: ${percent === 100 ? '#4ade80' : '#94a3b8'}; font-weight: 600;">
              ${doneCount} / ${total} (${percent}%)
            </span>
          </div>

          <div class="progress-bar-bg" style="margin-bottom: 8px;">
            <div class="progress-bar-fill" style="width: ${percent}%; background: linear-gradient(90deg, #a78bfa, #f472b6);"></div>
          </div>

          <div class="task-list" style="margin-bottom: 0;">
            ${taskItemsHtml}
          </div>
          ${idleHtml}
        `;
        container.appendChild(card);
      });
    }

    function toggleCollapse(groupId) {
      if (collapsedGroupIds.has(groupId)) {
        collapsedGroupIds.delete(groupId);
      } else {
        collapsedGroupIds.add(groupId);
      }
      renderGroups();
    }

    function addNewGroup() {
      const groupName = prompt("請輸入組別名稱（例：場務組、器材組、隊輔組）：");
      if (!groupName) return;
      groups.push({ id: Date.now(), name: groupName, tasks: [] });
      saveGroupsToCloud();
    }

    function deleteGroup(groupId) {
      const target = groups.find(g => g.id === groupId);
      const name = target ? target.name : '此組別';
      if (confirm(`確定要刪除整個「${name}」及其所有事項嗎？`)) {
        groups = groups.filter(g => g.id !== groupId);
        saveGroupsToCloud();
      }
    }

    function addTask(groupId) {
      const taskInput = document.getElementById(`input-task-${groupId}`);
      const ownerInput = document.getElementById(`input-owner-${groupId}`);
      const stimeInput = document.getElementById(`input-stime-${groupId}`);
      const etimeInput = document.getElementById(`input-etime-${groupId}`);
      const text = taskInput.value.trim();
      const owner = ownerInput.value.trim();
      const sTime = stimeInput.value;
      const eTime = etimeInput.value;
      if (!text) return;

      const group = groups.find(g => g.id === groupId);
      if (group) {
        if (!group.tasks) group.tasks = [];
        group.tasks.push({
          id: Date.now(),
          text: text,
          owner: owner,
          startTime: sTime || '',
          endTime: eTime || '',
          done: false
        });
        saveGroupsToCloud();
      }
    }

    function editTaskOwner(groupId, taskId) {
      const group = groups.find(g => g.id === groupId);
      if (!group || !group.tasks) return;
      const task = group.tasks.find(t => t.id === taskId);
      if (!task) return;

      const newOwner = prompt(`更換「${task.text}」的負責人（可填多人，用逗號或空格分開）：`, task.owner || '');
      if (newOwner !== null) {
        task.owner = newOwner.trim();
        saveGroupsToCloud();
      }
    }

    // 點擊即時修改時段區間
    function editTaskTimeRange(groupId, taskId) {
      const group = groups.find(g => g.id === groupId);
      if (!group || !group.tasks) return;
      const task = group.tasks.find(t => t.id === taskId);
      if (!task) return;

      const curStart = task.startTime || task.time || '';
      const curEnd = task.endTime || '';

      const newStart = prompt(`設定開始時間（格式如 12:30）：\n（留空按確定可清除）`, curStart);
      if (newStart === null) return;

      let newEnd = '';
      if (newStart.trim() !== '') {
        const promptEnd = prompt(`設定結束時間（格式如 12:40，可選填）：`, curEnd);
        if (promptEnd !== null) newEnd = promptEnd.trim();
      }

      task.startTime = newStart.trim();
      task.endTime = newEnd;
      delete task.time; // 舊格式轉移
      saveGroupsToCloud();
    }

    function toggleTask(groupId, taskId) {
      const group = groups.find(g => g.id === groupId);
      if (group && group.tasks) {
        const task = group.tasks.find(t => t.id === taskId);
        if (task) {
          task.done = !task.done;
          saveGroupsToCloud();
        }
      }
    }

    function deleteTask(groupId, taskId) {
      const group = groups.find(g => g.id === groupId);
      if (group && group.tasks) {
        const task = group.tasks.find(t => t.id === taskId);
        const name = task ? task.text : '此事項';
        if (confirm(`確定要刪除事項「${name}」嗎？`)) {
          group.tasks = group.tasks.filter(t => t.id !== taskId);
          saveGroupsToCloud();
        }
      }
    }

    function resetAllTaskChecks() {
      if (confirm("確定要將「所有組別」的打勾狀態全部清空重設嗎？\n（組別和待辦事項都會完整保留，僅重設完成進度）")) {
        groups.forEach(group => {
          if (group.tasks) {
            group.tasks.forEach(t => t.done = false);
          }
        });
        saveGroupsToCloud();
      }
    }

    function escapeHtml(string) {
      return String(string || '').replace(/[&<>"']/g, function (s) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[s];
      });
    }
  </script>
</body>
</html>
