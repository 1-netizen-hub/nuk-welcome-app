<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動細流與場佈倒數系統</title>

  <!-- PWA 設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="活動指揮中樞">
  <link rel="apple-touch-icon" href="icon-512.png">

  <!-- 引入 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    body { background-color: #121318; color: #f1f5f9; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    
    .container { width: 100%; max-width: 1050px; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #2e3440; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .title-area h1 { font-size: 22px; color: #f472b6; font-weight: 700; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .sync-status { font-size: 12px; background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); padding: 2px 8px; border-radius: 999px; font-weight: 500; }
    .clock-display { font-size: 14px; color: #94a3b8; margin-top: 4px; font-family: monospace; }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    button { cursor: pointer; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
    button:active { transform: scale(0.97); }
    .btn-pink { background: #db2777; color: white; }
    .btn-pink:hover { background: #be185d; }
    .btn-slate { background: #334155; color: #f1f5f9; }
    .btn-slate:hover { background: #475569; }
    .btn-subtle { background: rgba(244, 114, 182, 0.15); color: #f472b6; border: 1px solid rgba(244, 114, 182, 0.3); }
    .btn-subtle:hover { background: rgba(244, 114, 182, 0.25); }
    .btn-warning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .btn-warning:hover { background: rgba(245, 158, 11, 0.3); }
    .btn-danger { background: #991b1b; color: #fecaca; padding: 4px 8px; font-size: 12px; }

    /* Main Banner Countdown */
    .hero-banner { background: linear-gradient(135deg, #1e1b2e 0%, #172554 100%); border: 1px solid #3b0764; border-radius: 16px; padding: 28px 20px; text-align: center; margin-bottom: 28px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); }
    .stage-badge { display: inline-block; background: rgba(244, 114, 182, 0.2); color: #f472b6; padding: 4px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; margin-bottom: 8px; border: 1px solid rgba(244, 114, 182, 0.3); }
    .big-timer { font-size: clamp(60px, 12vw, 96px); font-weight: 800; font-family: monospace; color: #fb7185; letter-spacing: -2px; line-height: 1; margin: 10px 0; text-shadow: 0 0 20px rgba(251, 113, 133, 0.3); }
    .next-stage-hint { color: #cbd5e1; font-size: 15px; margin-top: 6px; }

    /* Content Layout */
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 820px) { .main-grid { grid-template-columns: 1fr; } }

    .panel { background: #18181b; border: 1px solid #27272a; border-radius: 14px; padding: 20px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #27272a; padding-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .panel-title { font-size: 16px; font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 8px; }

    /* Schedule Section */
    .schedule-list { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; padding-right: 4px; }
    .schedule-item { display: flex; align-items: center; justify-content: space-between; background: #27272a; padding: 10px 14px; border-radius: 10px; border-left: 4px solid #64748b; }
    .schedule-item.active { border-left-color: #f472b6; background: #2d1d29; }
    .schedule-info { display: flex; align-items: center; gap: 10px; flex-grow: 1; }
    .schedule-name { font-weight: 600; font-size: 15px; }
    input[type="time"] { background: #18181b; color: #f8fafc; border: 1px solid #3f3f46; border-radius: 6px; padding: 4px 8px; font-size: 13px; }

    /* Groups Section */
    .groups-container { display: flex; flex-direction: column; gap: 14px; max-height: 520px; overflow-y: auto; padding-right: 4px; }
    .group-card { background: #27272a; border-radius: 10px; padding: 14px; border: 1px solid #3f3f46; transition: all 0.2s ease; }
    
    .group-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
    .group-title-left { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: #38bdf8; }
    .collapse-icon { font-size: 12px; transition: transform 0.2s ease; color: #94a3b8; }
    .group-card.collapsed .collapse-icon { transform: rotate(-90deg); }
    .group-card.collapsed .group-body { display: none; }

    /* 進度條樣式 */
    .progress-wrap { margin-top: 8px; margin-bottom: 12px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 4px; }
    .progress-bar-bg { width: 100%; height: 6px; background: #18181b; border-radius: 999px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #4ade80); width: 0%; transition: width 0.3s ease; }

    .task-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #e2e8f0; background: #18181b; padding: 7px 10px; border-radius: 6px; }
    .task-item.done span.task-text { text-decoration: line-through; color: #64748b; }
    .task-left { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-grow: 1; }
    
    /* 負責人 Tag */
    .owner-tag { font-size: 11px; background: rgba(148, 163, 184, 0.15); color: #cbd5e1; padding: 1px 7px; border-radius: 4px; border: 1px solid rgba(148, 163, 184, 0.25); white-space: nowrap; }

    .add-box { display: flex; gap: 6px; margin-top: 8px; }
    .add-box input[type="text"] { background: #18181b; border: 1px solid #3f3f46; color: white; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
    .input-task-text { flex-grow: 1; }
    .input-task-owner { width: 85px; }

    footer { margin-top: 30px; font-size: 12px; text-align: center; color: #64748b; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-area">
        <h1>🌸 活動細流與場佈指揮中樞 <span class="sync-status" id="syncStatus">🟢 雲端同步中</span></h1>
        <div class="clock-display" id="realtimeClock">現在時間：--:--:--</div>
      </div>
      <div class="header-actions">
        <button class="btn-subtle" onclick="testGentleVoice()">🌸 語音測試</button>
        <button class="btn-pink" onclick="triggerGlobalBroadcast()">📢 全場廣播</button>
      </div>
    </header>

    <!-- 主倒數計時大畫幅 -->
    <div class="hero-banner">
      <div class="stage-badge" id="currentStageBadge">階段：載入中</div>
      <div class="big-timer" id="countdownTimer">00:00</div>
      <div class="next-stage-hint" id="nextStageHint">預計下一階段：--:--</div>
    </div>

    <!-- 雙欄版面：左側細流、右側組別卡片 -->
    <div class="main-grid">
      
      <!-- 左欄：細流時間設定 -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">⏱️ 細流流程控制</div>
          <button class="btn-slate" onclick="addNewStage()">+ 新增流程</button>
        </div>
        <div class="schedule-list" id="scheduleContainer">
          <!-- 動態渲染細流列表 -->
        </div>
      </div>

      <!-- 右欄：自訂組別事項 -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">📋 各組事項與進度</div>
          <div style="display: flex; gap: 6px;">
            <button class="btn-warning" onclick="resetAllTaskChecks()" title="保留所有組別與事項，僅將打勾重設為未完成">🔄 一鍵重設打勾</button>
            <button class="btn-slate" onclick="addNewGroup()">+ 新增組別</button>
          </div>
        </div>
        <div class="groups-container" id="groupsContainer">
          <!-- 動態渲染組別與卡片 -->
        </div>
      </div>

    </div>

    <footer>高大社團・溫柔控場場佈系統 v4.0 (含負責人標籤、進度條、卡片摺疊與一鍵重設)</footer>
  </div>

  <script>
    // 註冊 PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
      });
    }

    // 1. Firebase 初始化
    const firebaseConfig = {
      apiKey: "AIzaSyCi6WM8s9rSxxmb8DQw_hB35uxAQCv5hIw",
      authDomain: "nuk-party.firebaseapp.com",
      databaseURL: "https://nuk-party-default-rtdb.firebaseio.com",
      projectId: "nuk-party",
      storageBucket: "nuk-party.firebasestorage.app",
      messagingSenderId: "342555162897",
      appId: "1:342555162897:web:479b44b6d6efd69b73b4b0",
      measurementId: "G-NXMMPR25KG"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const defaultSchedule = [
      { id: 1, name: '集合', time: '17:00' },
      { id: 2, name: '移動', time: '17:15' },
      { id: 3, name: '場佈', time: '17:30' },
      { id: 4, name: '吃晚餐', time: '18:00' },
      { id: 5, name: '最後準備', time: '18:30' },
      { id: 6, name: '報到', time: '18:50' }
    ];

    let schedule = [];
    let groups = [];
    let collapsedGroupIds = new Set(); // 本地紀錄卡片摺疊狀態
    let announcedMilestones = new Set();
    let initialBroadcastIgnored = false;

    window.onload = function() {
      setInterval(updateClockAndTimer, 1000);

      // 監聽連線狀態
      db.ref('.info/connected').on('value', (snap) => {
        const el = document.getElementById('syncStatus');
        if (snap.val() === true) {
          el.innerText = '🟢 雲端同步中';
          el.style.color = '#4ade80';
        } else {
          el.innerText = '🔴 斷線重連中';
          el.style.color = '#f87171';
        }
      });

      // 監聽細流
      db.ref('event_schedule').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          schedule = Array.isArray(val) ? val.filter(Boolean) : Object.values(val);
        } else {
          schedule = defaultSchedule;
          db.ref('event_schedule').set(defaultSchedule);
        }
        renderSchedule();
      });

      // 監聽組別事項
      db.ref('event_groups').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          const raw = Array.isArray(val) ? val.filter(Boolean) : Object.values(val);
          groups = raw.map(g => ({
            ...g,
            tasks: g.tasks ? (Array.isArray(g.tasks) ? g.tasks.filter(Boolean) : Object.values(g.tasks)) : []
          }));
        } else {
          groups = [];
        }
        renderGroups();
      });

      // 監聽全場廣播
      db.ref('global_broadcast').limitToLast(1).on('child_added', (snapshot) => {
        if (!initialBroadcastIgnored) {
          initialBroadcastIgnored = true;
          return;
        }
        const data = snapshot.val();
        if (data && data.text) {
          gentleAnnounce(data.text);
        }
      });
    };

    function saveScheduleToCloud() {
      db.ref('event_schedule').set(schedule);
    }

    function saveGroupsToCloud() {
      db.ref('event_groups').set(groups);
    }

    // 2. 時鐘與倒數
    function updateClockAndTimer() {
      const now = new Date();
      document.getElementById('realtimeClock').innerText = `現在時間：${now.toLocaleTimeString('zh-TW', { hour12: false })}`;

      if (!schedule || schedule.length === 0) {
        document.getElementById('currentStageBadge').innerText = "未設定流程";
        document.getElementById('countdownTimer').innerText = "--:--";
        document.getElementById('nextStageHint').innerText = "請在左側新增細流流程";
        return;
      }

      const sortedSchedule = [...schedule].sort((a, b) => a.time.localeCompare(b.time));
      const currentTimeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
      
      let currentStage = null;
      let nextStage = null;

      for (let i = 0; i < sortedSchedule.length; i++) {
        const itemTime = sortedSchedule[i].time;
        if (currentTimeStr < itemTime) {
          nextStage = sortedSchedule[i];
          currentStage = i > 0 ? sortedSchedule[i - 1] : { name: '準備階段', time: '00:00' };
          break;
        }
      }

      if (!nextStage && sortedSchedule.length > 0) {
        currentStage = sortedSchedule[sortedSchedule.length - 1];
        document.getElementById('currentStageBadge').innerText = `當前階段：${currentStage.name}`;
        document.getElementById('countdownTimer').innerText = "進行中";
        document.getElementById('nextStageHint').innerText = "所有細流階段已展開";
        highlightActiveStage(currentStage.id);
        return;
      }

      highlightActiveStage(currentStage ? currentStage.id : null);
      document.getElementById('currentStageBadge').innerText = `當前階段：${currentStage ? currentStage.name : '準備中'}`;
      
      const [nh, nm] = nextStage.time.split(':');
      const targetDate = new Date();
      targetDate.setHours(parseInt(nh), parseInt(nm), 0, 0);

      const diffMs = targetDate - now;
      if (diffMs > 0) {
        const totalSec = Math.floor(diffMs / 1000);
        const min = Math.floor(totalSec / 60);
        const sec = totalSec % 60;
        document.getElementById('countdownTimer').innerText = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        document.getElementById('nextStageHint').innerText = `下一階段：${nextStage.name} (${nextStage.time})`;

        const milestoneKey = `${nextStage.name}_${min}`;
        if (min === 5 && sec === 0 && !announcedMilestones.has(milestoneKey)) {
          announcedMilestones.add(milestoneKey);
          playGentleChime();
          setTimeout(() => {
            speakGentle(`各位幹部辛苦囉，距離下一個階段『${nextStage.name}』還有五分鐘，請大家把握時間喔。`);
          }, 1200);
        }
      } else {
        const arriveKey = `${nextStage.name}_0`;
        if (!announcedMilestones.has(arriveKey)) {
          announcedMilestones.add(arriveKey);
          playGentleChime();
          setTimeout(() => {
            speakGentle(`現在時間 ${nextStage.time}，進入『${nextStage.name}』階段，大家加油！`);
          }, 1200);
        }
      }
    }

    function highlightActiveStage(activeId) {
      document.querySelectorAll('.schedule-item').forEach(el => el.classList.remove('active'));
      if (activeId) {
        const activeEl = document.getElementById(`schedule-item-${activeId}`);
        if (activeEl) activeEl.classList.add('active');
      }
    }

    // 3. 語音與和絃
    function playGentleChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.12);
          gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + idx * 0.12 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.12);
          osc.stop(ctx.currentTime + idx * 0.12 + 1.2);
        });
      } catch (e) { console.log(e); }
    }

    function speakGentle(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 0.92;
      utter.pitch = 1.15;
      utter.volume = 0.95;

      const voices = window.speechSynthesis.getVoices();
      const softVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('HsiaoChen') || v.name.includes('Mei-Jia') || v.name.includes('Yating') || v.name.includes('Natural')));
      if (softVoice) utter.voice = softVoice;

      window.speechSynthesis.speak(utter);
    }

    function gentleAnnounce(text) {
      playGentleChime();
      setTimeout(() => speakGentle(text), 1000);
    }

    function testGentleVoice() {
      playGentleChime();
      setTimeout(() => speakGentle("這是在測試溫柔廣播音量，祝今天的活動一切順利喔！"), 1000);
    }

    function triggerGlobalBroadcast() {
      const msg = prompt("請輸入要對全體幹部手機廣播的內容：", "各位幹部辛苦囉，請大家注意目前的細流時間，加油喔！");
      if (!msg) return;
      db.ref('global_broadcast').push({ text: msg, timestamp: Date.now() });
    }

    // 4. 細流管理（含刪除確認）
    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      container.innerHTML = '';
      const sorted = [...schedule].sort((a, b) => a.time.localeCompare(b.time));

      sorted.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'schedule-item';
        div.id = `schedule-item-${item.id}`;
        div.innerHTML = `
          <div class="schedule-info">
            <input type="time" value="${item.time}" onchange="updateStageTime(${item.id}, this.value)">
            <span class="schedule-name">${escapeHtml(item.name)}</span>
          </div>
          <button class="btn-danger" onclick="deleteStage(${item.id})">刪除</button>
        `;
        container.appendChild(div);
      });
    }

    function updateStageTime(id, newTime) {
      const target = schedule.find(s => s.id === id);
      if (target) {
        target.time = newTime;
        saveScheduleToCloud();
      }
    }

    function addNewStage() {
      const name = prompt("請輸入流程名稱（例：隊輔總彩排）：");
      if (!name) return;
      const time = prompt("請輸入開始時間（格式如 17:45）：", "18:00");
      if (!time) return;

      schedule.push({ id: Date.now(), name: name, time: time });
      saveScheduleToCloud();
    }

    function deleteStage(id) {
      const target = schedule.find(s => s.id === id);
      const name = target ? target.name : '此流程';
      if (confirm(`確定要刪除「${name}」嗎？`)) {
        schedule = schedule.filter(s => s.id !== id);
        saveScheduleToCloud();
      }
    }

    // 5. 組別事項、負責人、進度條、卡片摺疊與一鍵重設
    function renderGroups() {
      const container = document.getElementById('groupsContainer');
      container.innerHTML = '';

      if (groups.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: #64748b; padding: 20px 0; font-size: 14px;">目前尚未新增組別，點擊右上角「+ 新增組別」開始建立！</div>`;
        return;
      }

      groups.forEach((group) => {
        const isCollapsed = collapsedGroupIds.has(group.id);
        const tasks = group.tasks || [];
        const total = tasks.length;
        const doneCount = tasks.filter(t => t.done).length;
        const percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);

        const card = document.createElement('div');
        card.className = `group-card ${isCollapsed ? 'collapsed' : ''}`;
        card.id = `group-card-${group.id}`;
        
        let tasksHtml = '';
        tasks.forEach(task => {
          tasksHtml += `
            <div class="task-item ${task.done ? 'done' : ''}">
              <div class="task-left" onclick="toggleTask(${group.id}, ${task.id})">
                <input type="checkbox" ${task.done ? 'checked' : ''} style="cursor:pointer;" onchange="toggleTask(${group.id}, ${task.id})">
                <span class="task-text">${escapeHtml(task.text)}</span>
                ${task.owner ? `<span class="owner-tag">👤 ${escapeHtml(task.owner)}</span>` : ''}
              </div>
              <button class="btn-danger" onclick="deleteTask(${group.id}, ${task.id})" style="padding:2px 6px;">✕</button>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="group-header" onclick="toggleCollapse(${group.id})">
            <div class="group-title-left">
              <span class="collapse-icon">▼</span>
              <span>📌 ${escapeHtml(group.name)}</span>
            </div>
            <div style="display:flex; align-items:center; gap:8px;" onclick="event.stopPropagation();">
              <button class="btn-danger" onclick="deleteGroup(${group.id})">刪除組別</button>
            </div>
          </div>

          <!-- 進度條 -->
          <div class="progress-wrap">
            <div class="progress-meta">
              <span>進度：${doneCount} / ${total}</span>
              <span>${percent}%</span>
            </div>
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${percent}%;"></div>
            </div>
          </div>

          <!-- 可摺疊內容主體 -->
          <div class="group-body">
            <div class="task-list">${tasksHtml || '<div style="color:#64748b; font-size:12px; padding:4px 0;">暫無事項</div>'}</div>
            <div class="add-box">
              <input type="text" id="input-task-${group.id}" class="input-task-text" placeholder="輸入待辦事項...">
              <input type="text" id="input-owner-${group.id}" class="input-task-owner" placeholder="負責人(選填)">
              <button class="btn-slate" onclick="addTask(${group.id})">新增</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 卡片摺疊/展開切換
    function toggleCollapse(groupId) {
      if (collapsedGroupIds.has(groupId)) {
        collapsedGroupIds.delete(groupId);
      } else {
        collapsedGroupIds.add(groupId);
      }
      renderGroups();
    }

    function addNewGroup() {
      const groupName = prompt("請輸入組別名稱（例：場務組、器材組、隊輔組）：");
      if (!groupName) return;
      groups.push({ id: Date.now(), name: groupName, tasks: [] });
      saveGroupsToCloud();
    }

    function deleteGroup(groupId) {
      const target = groups.find(g => g.id === groupId);
      const name = target ? target.name : '此組別';
      if (confirm(`確定要刪除整個「${name}」及其所有事項嗎？`)) {
        groups = groups.filter(g => g.id !== groupId);
        saveGroupsToCloud();
      }
    }

    function addTask(groupId) {
      const taskInput = document.getElementById(`input-task-${groupId}`);
      const ownerInput = document.getElementById(`input-owner-${groupId}`);
      const text = taskInput.value.trim();
      const owner = ownerInput.value.trim();
      if (!text) return;

      const group = groups.find(g => g.id === groupId);
      if (group) {
        if (!group.tasks) group.tasks = [];
        group.tasks.push({
          id: Date.now(),
          text: text,
          owner: owner,
          done: false
        });
        saveGroupsToCloud();
      }
    }

    function toggleTask(groupId, taskId) {
      const group = groups.find(g => g.id === groupId);
      if (group && group.tasks) {
        const task = group.tasks.find(t => t.id === taskId);
        if (task) {
          task.done = !task.done;
          saveGroupsToCloud();
        }
      }
    }

    function deleteTask(groupId, taskId) {
      const group = groups.find(g => g.id === groupId);
      if (group && group.tasks) {
        const task = group.tasks.find(t => t.id === taskId);
        const name = task ? task.text : '此事項';
        if (confirm(`確定要刪除事項「${name}」嗎？`)) {
          group.tasks = group.tasks.filter(t => t.id !== taskId);
          saveGroupsToCloud();
        }
      }
    }

    // 一鍵重設所有打勾（保留事項，清除勾選狀態）
    function resetAllTaskChecks() {
      if (confirm("確定要將「所有組別」的打勾狀態全部清空重設嗎？\n（組別和待辦事項都會完整保留，僅重設完成進度）")) {
        groups.forEach(group => {
          if (group.tasks) {
            group.tasks.forEach(t => t.done = false);
          }
        });
        saveGroupsToCloud();
      }
    }

    function escapeHtml(string) {
      return String(string || '').replace(/[&<>"']/g, function (s) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[s];
      });
    }
  </script>
</body>
</html>
